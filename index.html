function openSqDlg(){
  if (!SQ_LAST || !SQ_LAST.total) return;
  let el = document.getElementById("sqDlg");
  if (!el){
    el = document.createElement("div");
    el.id = "sqDlg";
    document.body.appendChild(el);
  }
  el.innerHTML = sqDlgHTML(SQ_LAST);
  el.classList.add("on");
  document.body.style.overflow = "hidden";
  const x = document.getElementById("sqdX");
  if (x) x.focus();
}
function closeSqDlg(){
  const el = document.getElementById("sqDlg");
  if (!el || !el.classList.contains("on")) return;
  el.classList.remove("on");
  document.body.style.overflow = "";
}
document.addEventListener("click", e => {
  const el = document.getElementById("sqDlg");
  if (e.target.closest && e.target.closest("#sqPaidBox")){ openSqDlg(); return; }
  if (el && el.classList.contains("on")){
    if (e.target.closest("#sqdX") || e.target === el) closeSqDlg();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSqDlg();
  const box = e.target.closest && e.target.closest("#sqPaidBox");
  if (box && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openSqDlg(); }
});

/* 评价正文：规则引擎算出来的那一版（AI 没测通、或 AI 失败时兜底用） */
function vdStatic(V){
  let h = "";
  ((V && V.blocks) || []).forEach(b => {
    if (b.lead) h += '<div class="block"><div class="lead">' + b.html + "</div></div>";
    else if (b.final) h += '<div class="final">' + b.final + "</div>";
    else h += '<div class="block"><p>' + b.html + "</p></div>";
  });
  h += '<div class="motto">-- 以上为机器按数据生成，语气仅供参考，别当真 --</div>';
  return h;
}
/* 评价正文：AI 正在写的时候占个位，不让规则文案先露出来再被整段换掉 */

/* AI 这条线断了（没测通 / 没 key / 请求失败）就把规则文案填回去，别把页面停在骨架上 */
function vdRestore(V){
  const vd = document.getElementById("vdBody");
  if (!vd) return;
  if (vd.dataset.ai === "done") return;      // 已经是 AI 正文，不能覆盖
  vd.dataset.ai = "";
  vd.innerHTML = vdStatic(V || (typeof LAST !== "undefined" && LAST && LAST.V));
}

function renderVerdict(V){
  const G = V.grade;
  const nxt = G ? (G.over ? null : GRADES[G.idx + 1]) : null;
  /* 有没有可用的 AI：没 key（线上版默认就这样）就彻底当规则版用，
     不摆「AI 重写」按钮、不铺骨架、也不发任何请求 */
  const canAI = !AI_OFF && typeof aiKey === "function" && !!aiKey();
  /* 被带徽标：monkey = 🐵 完了（判定成立且比例很高），leaned = 有这倾向 */
  const CRV = (V.s && V.s.carried) || null;
  /* 填线徽标：god = 填线战神（杀得多死得多），baby = 填线宝宝（杀得少死得多） */
  const FLV = (G && G.fill) || (V.s && V.s.fill) || null;
  /* 抗压徽标：少打多场次够多 → 抗压大师 */
  const OTV = (G && G.outnumbered) || (V.s && V.s.outnumbered) || null;
  let h = '<div class="card" id="verdictCard"><div class="card-h"><h2>成分评价</h2><span class="ln"></span>'
    + '<span class="tag">' + (G ? G.g.no + " " + G.g.name + " · 总分 " + f1(G.raw) : "机器分 " + Math.round(V.sc)) + "</span>"
    + (FLV && FLV.kind === "god" ? '<span class="tag fill">填线战神</span>'
      : FLV && FLV.kind === "baby" ? '<span class="tag fillbaby">填线宝宝</span>' : "")
    + (OTV && OTV.master ? '<span class="tag stress">抗压大师</span>' : "")
    + (CRV && CRV.verdict
        ? '<span class="tag monkey' + (CRV.verdict === "leaned" ? " soft" : "") + '">🐵 被带'
          + (CRV.verdict === "leaned" ? " " + f1(CRV.rate) + "%" : "") + "</span>"
        : "")
    + (canAI ? '<button class="ai-run" id="aiGo">AI 重写</button>' : "") + "</div>";

  // 分级条
  if (G){
    h += '<div class="gstrip">'
      + '<span class="gno">' + esc(G.g.no) + '</span>'
      + '<span class="gnm">' + esc(G.g.name) + '</span>'
      + (G.g.band !== G.g.name ? '<span class="gbd">' + esc(G.g.band) + "</span>" : "")
      + '<span class="gsc">总分 <b>' + f1(G.raw) + "</b>/" + f1(OVER_SCORE) + "</span>"
      + (nxt ? '<span class="gsc">距 ' + esc(nxt.no + " " + nxt.name) + " 差 <b>" + f1(G.gap) + "</b></span>"
        : (G.over ? '<span class="gsc warn">已越过及格线</span>'
          : G.selfBench ? '<span class="gsc">6.2 及格线就是他</span>'
          : '<span class="gsc">判级还差 <b>' + f1(Math.max(0, OVER_SCORE - (G.core || 0))) + "</b> 分（只看枪法+加分）</span>"))
      + '<span class="gsw">枪法 <b>' + f1(G.gun * 100) + '%</b>'
      + ((G.boost || 0) > 0.005 || (G.stressMul || 1) > 1.001
          ? "（" + [
              (G.boost || 0) > 0.005 ? "击杀领先 +" + f1(G.boost * 100) + "%" : "",
              (G.stressMul || 1) > 1.001 ? "抗压 ×" + f2(G.stressMul) : ""
            ].filter(Boolean).join(" · ") + "）"
          : "")
      + ' · 加分 <b>+' + f1(G.bonusSum) + "</b>"
      + (Math.abs(G.fillAdj || 0) > 0.05 ? " · 填线 <b>" + (G.fillAdj > 0 ? "+" : "") + f1(G.fillAdj) + "</b>" : "")
      + ((G.outAdj || 0) > 0.05 ? " · 少打多 <b>+" + f1(G.outAdj) + "</b>" : "")
      + "</span>"
      + (G.over ? '<span class="gsc' + (G.suspect ? " warn" : "") + '">比标准1高 <b>+' + f1(G.raw - OVER_SCORE) + "</b>"
          + (G.suspect ? "（超 15%）→ 数据有疑问" : " → 6.2+") + "</span>" : "")
      + "</div>";
  }

  // 风格标签
  if (V.tags && V.tags.length){
    h += '<div class="tagrow">' + V.tags.map(t => '<span class="chip ' + t.tone + '">' + esc(t.t) + "</span>").join("") + "</div>";
  }
  // 基础分：枪法
  const s = V.s || {};
  if (G){
    const gb = x => (x.d === 2 ? f2(x.v) : f1(x.v)) + x.unit;
    h += '<div class="scd"><span class="lb">枪法分（枪法比 × 100，标准1 原始枪法 = ' + f1(BASE_SCORE)
      + " 分；6.2 及格线 = 标准1 加完抗压权重后的 " + f1(OVER_SCORE) + " 分）</span>"
      + '<span class="' + (G.gun >= 0.96 ? "up" : G.gun < 0.4 ? "dn" : "") + '" title="场均击杀 '
        + f1(s.avgK || 0) + "，标准1 " + f1(BENCH.avgK) + '（K/D 不计入枪法，在下面单独加分）">'
      + "枪法 " + f1(G.gun * 100) + '% <i>场均 ' + f1(s.avgK || 0) + " 杀</i></span>"
      + '<span class="tt">= ' + f1(G.gun * BASE_SCORE) + "</span></div>";
    /* 击杀领先加成：只在真的算出差距时显示，免得人人多一行 */
    if ((G.boost || 0) > 0.005){
      const kl = (V.s && V.s.killLead) || {};
      h += '<div class="scd"><span class="lb">击杀领先加成（同场按击杀排名，下一位比自己少多少）</span>'
        + '<span class="up" title="样本 ' + (kl.n || 0) + "/" + (kl.total || 0) + " 场，平均领先 "
          + f1((kl.lead || 0) * 100) + "%，平均每场比下一位多 " + f1(kl.gapAvg || 0) + ' 杀">'
        + "击杀权重 ×" + (1 + G.boost).toFixed(3) + ' <i>+' + f1(G.boost * 100) + "%</i></span>"
        + '<span class="tt">' + (G.gun0 * 100).toFixed(1) + "% → " + (G.gunLead * 100).toFixed(1) + "%</span></div>";
    }
    /* 抗压大师：枪法权重 ×1.2，只在命中称号时显示 */
    if ((G.stressMul || 1) > 1.001){
      const ot = G.outnumbered || {};
      h += '<div class="scd"><span class="lb">抗压大师（少打多的局人少还打得出来；6.2 及格线同步抬到 '
        + f1(OVER_SCORE) + " 分）</span>"
        + '<span class="up" title="少打多出彩 ' + (ot.hit || 0) + "/" + (ot.n || 0) + " 场，占 "
          + f1(ot.rate || 0) + "%，对面平均多 " + f1(ot.gapAvg || 0) + ' 个真人">'
        + "枪法权重 ×" + G.stressMul.toFixed(2) + "</span>"
        + '<span class="tt">' + (G.gunLead * 100).toFixed(1) + "% → " + (G.gun * 100).toFixed(1)
        + "%（+" + f1(G.stressGain || 0) + " 分）</span></div>";
    }
    // 填线修正：战神加分 / 宝宝扣分，只有命中判定才显示这一行
    if (Math.abs(G.fillAdj || 0) > 0.05){
      const fl = G.fill || {};
      h += '<div class="scd"><span class="lb">填线修正（'
        + (fl.kind === "god" ? "杀得多、死得也多，正面拿命换位置" : "杀得少、死得也多，冲上去没换成") + "）</span>"
        + '<span class="' + (fl.kind === "god" ? "up" : "dn") + '" title="场均 ' + f1(fl.K) + " 杀 / " + f1(fl.D)
          + " 个班被打掉，K/D " + f2(fl.kd)
          + "｜战神门槛：场均 ≥" + f1(FILL.godK) + " 杀、≥" + f1(FILL.godD) + " 班、K/D ≤" + f2(FILL.godKd)
          + "｜宝宝门槛：场均 ≤" + f1(FILL.babyK) + " 杀、K/D ≤" + f2(FILL.babyKd) + "、场均 ≥" + f1(FILL.babyD) + ' 班">'
        + (fl.kind === "god" ? "填线战神" : "填线宝宝") + " " + (G.fillAdj > 0 ? "+" : "") + f1(G.fillAdj)
        + ' <i>场均 ' + f1(fl.K) + " 杀 / 被打掉 " + f1(fl.D) + " 班 · K/D " + f2(fl.kd) + "</i></span>"
        + '<span class="tt">' + (G.fillAdj > 0 ? "+" : "") + f1(G.fillAdj) + "</span></div>";
    }
    // 额外加分：4:2:1:1:1:1
    h += '<div class="scd"><span class="lb">额外加分（4:2:1:1:1:1，只算超出标准1的部分）</span>'
      + G.bonus.map(x => '<span class="' + (x.pts > 0.05 ? "up" : "") + '" title="标准1 '
          + (x.d === 2 ? f2(x.ref) : f1(x.ref)) + x.unit + '">'
          + x.k + (x.pts > 0.05 ? " +" + f1(x.pts) : "") + " <i>" + gb(x) + "</i></span>").join("")
      + '<span class="tt">+' + f1(G.bonusSum) + "</span></div>";
    // 少打多加成：只在真的给分时显示
    if ((G.outAdj || 0) > 0.05){
      const ot = G.outnumbered || {};
      h += '<div class="scd"><span class="lb">少打多加成（对面名单人更多，这局还打得出来）</span>'
        + '<span class="up" title="少打多样本 ' + (ot.n || 0) + " 场，出彩 " + (ot.hit || 0) + " 场（"
          + f1(ot.rate || 0) + "%），对面平均多 " + f1(ot.gapAvg || 0) + ' 人；口径是战绩名单（每场 3~13 条）">'
        + "以少打多 +" + f1(G.outAdj) + " <i>出彩 " + (ot.hit || 0) + "/" + (ot.n || 0) + " 场 · 对面多 "
        + f1(ot.gapAvg || 0) + " 人</i></span>"
        + '<span class="tt">+' + f1(G.outAdj) + "</span></div>";
    }
  }
  /* 正文单独包一层：AI 生成成功后直接把这层换成 AI 版，分数条 / 加分项这些数据不动。
     AI 已测通时不先铺规则文案——否则用户先读一遍，几秒后整段被替换，很跳。 */
  const useAI = canAI && typeof aiAuto === "function" && aiAuto();
  h += '<div id="vdBody"' + (useAI ? ' data-ai="pending"' : "") + ">";
  h += useAI ? vdSkeleton() : vdStatic(V);
  h += "</div>";
  h += "</div>";
  return h;
}

/* =====================================================================
   AI 配置｜写死在页面里，界面上不显示
   直连 DeepSeek 官方接口（浏览器可直接跨域，不需要任何后端中转）。

   KEY 不以明文存放：下面 key 字段是一段混淆体（字符码逐位异或后倒序），
   运行时用一行匿名函数还原，文件里搜不到 sk- 开头的串，截图也贴不出可用的 KEY。

   本文件是 GitHub Pages 用的线上版，key 字段已清空：
   第一次用一次带 #k=sk-你的KEY 的地址打开，KEY 就存进这台机器的浏览器，之后正常访问即可。
   换 KEY 就清掉 localStorage 里的 cj_ai_key，再用新链接打开一次。
   ===================================================================== */
/* 规则版开关：生成「成分分析_规则版.html」时这里会被改成 true，
   页面会把所有 AI 入口摘掉、也不会发出任何 AI 请求。 */
const AI_OFF = false;
/*@@CFG@@*/
const AI_CFG = {
  url:   "https://api.deepseek.com/v1",  // DeepSeek 官方接口
  /* KEY 混淆体：逐字符码 ^ 0x5A 后倒序写入，运行时还原成明文，只存在于内存里 */
  key:   "",   // 线上版不内置 KEY：用一次 #k=sk-xxx 打开，存进浏览器后就不用再带
  model: "deepseek-chat"                 // deepseek-chat（快）/ deepseek-v4-pro（更强）
};

/* ---------------- AI 点评（直连 api.deepseek.com，不需要启动任何服务） ---------------- */
const AI_URL_DEF = AI_CFG.url || "https://api.deepseek.com/v1";
let AI_RUN = { on: false, ctrl: null };

/* 线上部署版（GitHub Pages）没有内置 KEY：用一次 #k=sk-xxx 打开，
   就把 KEY 存进这台机器的浏览器，之后正常访问即可，不用再带。
   KEY 放在 # 后面不会被服务器收到，也不进访问日志；存完顺手把地址栏抹掉。 */
(function(){
  try{
    const m = /(?:^|[#&])k=([^&]+)/.exec(location.hash || "");
    if (!m) return;
    const k = decodeURIComponent(m[1]).trim();
    if (!/^sk-[A-Za-z0-9]{16,}$/.test(k)) return;
    localStorage.setItem("cj_ai_key", k);
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    setTimeout(function(){ toastLine("KEY 已存进本机浏览器，之后直接用就行", "var(--green)", 6000); }, 900);
  }catch(e){}
})();
/* 没 KEY 时该去哪配：本地文件用 bat，线上用 #k= 链接（纯文本版，走 toast） */
function keyHintText(){
  if (location.protocol === "file:"){
    return "还没填 KEY —— 双击 设置DS配置.bat，按提示粘贴 key 后运行一次";
  }
  return "还没配置 KEY —— 用 …/#k=sk-你的key 的地址打开一次，存进浏览器即可";
}

function aiUrl(){ return (AI_CFG.url || localStorage.getItem("cj_ai_url") || AI_URL_DEF).trim(); }
/* AI 只在「测过连通性、并且测通了」之后才启用：
   没测过 / 上次测试失败 → aiOk() 为 false，查完不建 AI 卡、也不发任何请求。
   点顶部「测试 AI 连通性」成功后写 cj_ai_ok=1，之后的查询就自动走 AI。 */
function aiOk(){ return localStorage.getItem("cj_ai_ok") === "1"; }
function aiSetOk(v){ v ? localStorage.setItem("cj_ai_ok", "1") : localStorage.removeItem("cj_ai_ok"); }
function aiAuto(){ return aiOk(); }
/* 占位符（换 key 之前的样子）一律当成"没填"，否则状态行会误报已配置 */
function aiKeyIsPlaceholder(k){ return /PASTE|YOUR_KEY|YOUR_DEEPSEEK_KEY|在这里|填这里/i.test(k || ""); }
/* 写死的 key 优先；没写才回退到浏览器里存过的（兼容老配置） */
function aiKey(){
  const k = (AI_CFG.key || localStorage.getItem("cj_ai_key") || "").trim();
  return aiKeyIsPlaceholder(k) ? "" : k;
}
/* 模型名同理：直连中转站必须填，否则请求体里没有 model 会被拒 */
function aiModel(){ return (AI_CFG.model || localStorage.getItem("cj_ai_model") || "").trim(); }
/* 只填到 /v1 的中转站地址，自动补成完整的 chat/completions */
function aiEndpoint(){
  const u = aiUrl();
  return /\/v\d+$/.test(u) ? u + "/chat/completions" : u;
}
/* 是不是走本机中转（127.0.0.1 / localhost） */
function aiIsLocal(){ return /^https?:\/\/(127\.0\.0\.1|localhost|\[::1\])/i.test(aiUrl()); }
function aiModeText(){
  const m = aiModel();
  const mdl = m ? " · 模型 " + m : "";
  if (aiIsLocal()) return "本机中转（已不推荐）" + mdl;
  const k = aiKey();
  if (k) return "直连模式 · KEY 尾号 " + k.slice(-4) + mdl + " · " + aiEndpoint().replace(/^https?:\/\//, "");
  return keyHintText();
}
function refreshAiUI(){
  const md = $("#aiMode");
  if (md) md.textContent = aiModeText();
}

/* 连通性自检：发一条极小的请求，一次验证 地址 / KEY / 模型 / 跨域 四件事。
   不查战绩、不消耗多少 token，配完点一下就知道通没通。 */
/* 底部一次性提示条：原来 AI 状态写在面板里那行常驻文字上（已按用户要求删掉），
   改成点「测试 AI 连通性」时临时浮一条，几秒后自己消失，不占版面。 */
function toastLine(txt, color, ms){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = txt;
  el.style.color = color || "var(--txt)";
  el.classList.add("on");
  clearTimeout(toastLine._t);
  toastLine._t = setTimeout(() => el.classList.remove("on"), ms || 6000);
}

async function aiProbe(){
  if (AI_OFF) return false;
  const md = $("#aiMode"), btn = $("#aiTest"), dot = $("#aiDot"), top = $("#aiTestTop");
  const t0 = Date.now();
  if (btn) btn.disabled = true;
  if (top) top.disabled = true;
  if (dot) dot.className = "dot";

  const done = (txt, color) => {
    if (md){ md.style.color = color; md.textContent = txt; }
    else toastLine(txt, color, color === "var(--green)" ? 4200 : 8000);
    if (btn) btn.disabled = false;
    if (top) top.disabled = false;
    /* 只有绿（测通）才算启用 AI：查完才建卡、才自动生成；红则彻底不出现 AI 框 */
    aiSetOk(color === "var(--green)");
    /* 顶部小圆点：绿=通，红=报错，方便一眼看出状态 */
    if (dot) dot.className = "dot " + (color === "var(--green)" ? "on" : "err");
  };

  /* 页面里写死的 key 没填时，直接告诉他改哪里，别去撞 401 */
  if (!aiKey()){
    done(keyHintText(), "var(--red)");
    return false;
  }

  if (md){ md.style.color = "var(--dim)"; md.textContent = "正在测试 " + aiEndpoint().replace(/^https?:\/\//, "") + " …"; }
  else toastLine("正在测试 " + aiEndpoint().replace(/^https?:\/\//, "") + " …", "var(--dim)", 20000);

  const hdr = { "Content-Type": "application/json" };
  const sk = aiKey();
  if (sk) hdr["Authorization"] = "Bearer " + sk;
  const b = { messages: [{ role: "user", content: "只回复 ok" }], stream: false };
  if (aiModel()) b.model = aiModel();

  try{
    const res = await fetch(aiEndpoint(), { method: "POST", headers: hdr, body: JSON.stringify(b) });
    const raw = await res.text();
    let j = null, msg = "";
    try{ j = JSON.parse(raw); }catch(e){}
    if (j){
      const e2 = j.error || j;
      msg = typeof e2 === "string" ? e2 : (e2 && e2.message) || j.msg || "";
    }
    if (res.ok){
      const ch = j && j.choices && j.choices[0] && j.choices[0].message || {};
      const echo = String(ch.content || ch.reasoning_content || "").trim().slice(0, 16);
      done("连接成功 · 模型 " + (aiModel() || (j && j.model) || "服务端默认")
        + " · " + ((Date.now() - t0) / 1000).toFixed(1) + "s"
        + (echo ? " · 回声「" + echo + "」" : "") + " · 已启用 AI 点评", "var(--green)");
      return true;
    }
    let tip = "HTTP " + res.status + (msg ? " · " + msg : " " + raw.slice(0, 120));
    if (res.status === 401 || res.status === 403) tip += " → KEY 无效、过期，或账户没余额";
    else if (res.status === 404) tip += " → 地址路径不对；本机模式应为 " + AI_URL_DEF;
    else if (res.status === 502) tip += " → 上游拒绝；把这段发我看";
    else if (/model/i.test(msg)) tip += " → 模型名核对一下（当前 " + (aiModel() || "未填") + "）";
    done(tip, "var(--red)");
    return false;
  }catch(e){
    const m = String(e && e.message || e);
    const net = /Failed to fetch|NetworkError|Load failed|fetch failed|Network request failed/i.test(m);
    done(net
      ? "连不上 api.deepseek.com → 检查网络 / 代理 / 防火墙；换个网络或关掉代理再点这里"
      : "失败：" + m, "var(--red)");
    return false;
  }
}

/* 把算好的结论压成一份事实清单喂给模型：只让它换说法，不让它自己算 */
function aiFacts(D, V){
  const s = summarize(D.clean);
  const ov = D.ov || {};
  const L = [];
  const add = (k, v) => L.push("- " + k + "：" + v);

  add("对象", D.name + "（UID " + D.uid + "）");
  if (ov.sumBattles){
    /* 生涯只报总场次（资历），胜率/K-D/场均/MVP 一律不给，避免被当成评价依据 */
    add("生涯场次（仅资历，禁止用于评价）", "累计 " + num(ov.sumBattles) + " 场");
    const arr = ["ger","ussr","usa","jap"].map(c => ({ c: CN[c], b: ov[c + "Battles"] || 0 }))
      .filter(x => x.b > 0).sort((a, b) => b.b - a.b);
    if (arr.length) add("阵营场次分布（背景）", arr.slice(0, 3).map(x => x.c + " " + num(x.b) + " 场").join("；"));
  }

  const rawN = D.rows.length, rawW = D.rows.filter(isWin).length;
  const fleeRate = rawN ? (D.flee.length + D.quick.length) / rawN * 100 : 0;
  const BTopRate = s.top1Rate;
  add("取样", "最近 " + rawN + " 场（其中全 0 逃跑 " + D.flee.length + " 场、早退 " + D.quick.length
    + " 场，占 " + f1(fleeRate) + "%；剔除后有效 " + s.n + " 场）");
  if (s.botDrop > 0){
    add("人机局处理（必须提）", "抽样里有 " + s.botDrop + " 场人机局（双方真人 <7）。" 
      + "「场均击杀」已把这 " + s.botDrop + " 场整场剔除，只按剩下 " + s.fullN + " 场满编局算；"
      + "胜率、K/D、场均得分这些仍按场次权重降权（4~6 人算 0.4 场、≤3 人算 0.2 场，折合 "
      + f1(s.wN) + " 场）。两套口径不要混着推，正文里要点明「场均击杀已剔除人机局」");
  }
  add("有效战绩", s.wins + " 胜 " + s.loss + " 负（加权胜率 " + f1(s.winRate) + "%），K/D " + f2(s.kd)
    + "（口径：击杀 ÷ 被打掉的班数，标准1 是 " + f2(BENCH.kd) + "）"
    + "，场均 " + f1(s.avgK) + " 杀" + (s.botDrop > 0 ? "（已剔除人机局）" : "")
    + " / 场均被打掉 " + f1(s.avgD) + " 个班 / " + f1(s.avgA) + " 助，场均得分 " + Math.round(s.score)
    + "，单场最高 " + num(s.scoreMax)
    + "，全场第一 " + num(s.top1) + "/" + num(s.n) + "（" + f1(BTopRate) + "%）");
  add("总战斗时长", durLong(s.time) + "（得分效率 " + Math.round(s.spm) + " 分/分，被打掉 " + f2(s.dpm) + " 班/分）");
  add("枪法", "爆头率 " + f1(s.hsRate) + "%");
  add("战功 / 载具", "击杀 " + num(s.kills) + "，击毁敌方载具 " + num(s.veh) + " 台（坦克 " + num(s.tk)
    + " / 飞机 " + num(s.ak) + " / 运兵车 " + num(s.apc) + "），按坦克5、飞机3、运兵车3折算战功 +" + num(s.vehVal)
    + "，战功合计 " + num(s.wKills) + "（场均 " + f1(s.avgWK) + "），载具占战功 " + f1(s.vehRate) + "%");
  add("争夺", "点内击杀 " + num(s.pin) + "（进攻 " + num(s.pinA) + " / 防守 " + num(s.pinD) + "），占 "
    + f1(s.pinRate) + "%；占领点 " + num(s.cap) + " 次（场均 " + f2(s.capAvg) + "）");
  add("武器", "近战 " + f1(s.meleeRate) + "%、手雷/炸药包 " + f1(s.nadeRate) + "%、手枪 " + f1(s.pistolRate) + "%");
  add("支援", "一血 " + num(s.fb) + " 次（场均 " + f2(s.fbPer) + "），助攻 " + num(s.assists) + "（占击杀 "
    + f1(s.asstRate) + "%），工程设施 " + num(s.eng) + " 次、工事 " + num(s.fort) + " 次，兵员阵亡 "
    + num(s.deathsRaw) + " 人（只作参照，不进算分）");

  /* 击杀领先加成：已经算进枪法分，这里只是让正文能提，禁止再叠加 */
  const kl = (V && V.s && V.s.killLead) || null;
  if (kl && kl.boost > 0.005){
    add("击杀领先（已计入枪法分，禁止重复加分）",
      "同场按击杀排名，紧随其后的那位平均比自己少 " + f1(kl.lead * 100) + "%（平均每场少 "
      + f1(kl.gapAvg) + " 杀），样本 " + kl.n + "/" + kl.total + " 场，其中 " + kl.top1
      + " 场是全队击杀第一；由此击杀权重 ×" + (1 + kl.boost).toFixed(3)
      + "（+" + f1(kl.boost * 100) + "%）。正文可以点出「人头是硬抢的、不是跟着混的」，"
      + "但分数已经加完，不要再额外给分");
  }

  /* 被带判定：只让正文提，不额外加分也不额外扣分（总分口径已经定死） */
  const cr = (V && V.s && V.s.carried) || null;
  if (cr && cr.hit >= 3 && cr.rate >= 40){
    add("被带判定（必须在正文里点明）",
      "能取到同队名单的 " + cr.n + " 场里，有 " + cr.hit + " 场（" + f1(cr.rate) + "%）是「队友高杀高死、本人低死高 K/D」的结构："
      + "队友平均 " + f1(cr.mKAvg) + " 杀 / " + f1(cr.mDAvg) + " 死，本人 " + f1(cr.myKAvg) + " 杀 / " + f1(cr.myDAvg) + " 死，"
      + "本人 K/D " + f2(cr.kdAvg)
      + (cr.mate ? "；最常见的那个队友是「" + cr.mate.name + "」（" + cr.mate.n + " 场）" : "")
      + "。判定：" + (cr.verdict === "monkey"
          ? "🐵 被带 —— 队友在正面拿命换位置，他在后面收人头，这个 K/D 有水分，必须直说"
          : "有被带倾向 —— 提一句，但别当结论")
      + "。禁止把「死亡少」夸成会玩、会走位、惜命，那是没上去；也禁止因此改总分或改分级");
  }

  /* 填线判定：已计入总分，只能复述，不许再加减 */
  const fl = (V && V.grade && V.grade.fill) || (V && V.s && V.s.fill) || null;
  if (fl && fl.kind){
    add("填线判定（必须在正文里点明）",
      "场均 " + f1(fl.K) + " 杀 / 被打掉 " + f1(fl.D) + " 个班，K/D " + f2(fl.kd)
      + (fl.kind === "god"
          ? "，判「填线战神」：杀得多、死得也多，K/D 是被死亡拖低的，正面换命其实是产出——"
            + "正文里要写清「死得多不是不会躲，是他在最前面」，并给出已加的 " + f1(fl.adj) + " 分"
          : "，判「填线宝宝」：杀得少、死得还多，K/D 不到 1，属于纯兵力损耗——"
            + "正文里要直说「冲上去没换成」，并给出已扣的 " + f1(Math.abs(fl.adj)) + " 分")
      + "。这笔已经算进总分（填线修正 " + (fl.adj > 0 ? "+" : "") + f1(fl.adj)
      + "），禁止再额外加分或扣分，也禁止改分级");
  }

  /* 少打多：已经算进总分，正文必须提，禁止再叠加 */
  const ot = (V && V.grade && V.grade.outnumbered) || (V && V.s && V.s.outnumbered) || null;
  if (ot && ot.adj > 0.05){
    add("少打多加成（必须在正文里点明）",
      "能排出阵容的 " + ((V.env && V.env.n) || ot.n) + " 场里，有 " + ot.n + " 场是「对面名单人更多」的少打多局"
      + "（我方平均 " + f1(ot.myNAvg) + " 人 / 对面 " + f1(ot.opNAvg) + " 人，对面平均多 " + f1(ot.gapAvg) + " 个真人）；"
      + "其中 " + ot.hit + " 场（" + f1(ot.rate) + "%）他打得出来：场均 " + f1(ot.kAvg) + " 杀 / " + f1(ot.dAvg)
      + " 死，胜率 " + f1(ot.winRate) + "%，而且人少的一边还杀得比队友多（或整场击杀第一）。已加 " + f1(ot.adj) + " 分。"
      + "正文要写成「同样的人头在少打多的方向上换出来，含金量不一样」，"
      + "并说明口径是战绩名单（每场 3~13 条、人机不在内），不是真实满编人数。"
      + "这笔已经算进总分，禁止再额外加分");
    /* 抗压大师：枪法权重 ×1.2，正文必须出现，且必须说明这笔在枪法里、不许再叠 */
    if (ot.master){
      const gm = (V && V.grade) || {};
      add("抗压大师称号（必须在正文里点明）",
        "少打多局里打得出来的场次达到 " + ot.hit + " 场，占他少打多局的 " + f1(ot.rate) + "%（门槛 "
        + OUT_M.minHit + " 场 / " + OUT_M.minRate + "%），对面平均多 " + f1(ot.gapAvg) + " 个真人，"
        + "所以给「抗压大师」称号。正文要点明这个称号，写成「人少也肯顶、不挑局」，"
        + "并说明评分上给的是**枪法权重 ×" + OUT_M.mul.toFixed(2) + "**（枪法比 "
        + f1((gm.gunLead || 0) * 100) + "% → " + f1((gm.gun || 0) * 100) + "%，折 +"
        + f1(gm.stressGain || 0) + " 分）。这一笔已经算在枪法分里，"
        + "同时把 6.2 的及格线一起抬到了 " + f1(OVER_SCORE) + " 分（标准1 本人就是这个称号，"
        + "所以枪法满 " + f1(BASE_SCORE) + " 分只到 6.1）。"
        + "**禁止再额外加分**，也不许把它说成另一项独立的加分项");
    }
  }

  const SD = V.detail;
  const items = SD.items.filter(x => x.v !== 0).map(x => x.k + " " + (x.v > 0 ? "+" : "") + f1(x.v) + "（" + x.note + "）");
  if (items.length){
    add("打法修正（不计入总分）", items.join("；")
      + "。这些只反映打法倾向和纪律（逃跑、开团、支援、载具依赖），不参与总分，正文里可以提倾向，但不要拿它算分");
  }
  if (V.grade){
    const g = V.grade, nx = g.over ? null : GRADES[g.idx + 1];
    add("分级（必须写进正文）", g.g.no + " " + g.g.name + (g.g.band !== g.g.name ? "（" + g.g.band + "档）" : "")
      + "，总分 " + f1(g.raw) + "/" + f1(OVER_SCORE) + "。"
      + "该档画像：" + g.g.trait + " 该档定性：" + g.g.ev + " 对战换算：" + g.g.vs);
    add("判分构成", "总分 = 枪法分（枪法比 × 100，枪法比 = 场均击杀 ÷ 标准1 的 " + f1(BENCH.avgK) + "，K/D 不进枪法分）+ 额外加分；枪法比 "
      + f1(g.gun * 100) + "% → " + f1(g.gun * BASE_SCORE) + " 分；额外加分 4:2:1:1:1:1"
      + "（修造复活点/反击载具/占领点/点内击杀/K/D/击杀数量，只算超出的部分，载具按台数一台算一台）合计 +"
      + f1(g.bonusSum) + "；填线修正 " + ((g.fillAdj || 0) > 0 ? "+" : "") + f1(g.fillAdj || 0)
      + "（满足填线判定才有，战神加分 / 宝宝扣分）；少打多加成 +" + f1(g.outAdj || 0)
      + "；环境修正合计 " + ((g.envAdj || 0) > 0 ? "+" : "") + f1(g.envAdj || 0)
      + "；总分 " + f1(g.raw) + "（总分 = 枪法 + 加分 + 环境修正；但 6.2+ / 数据有疑问只按「枪法 + 加分」判，"
      + "填线/少打多不参与判级，避免补偿项把正常号推过 " + f1(SUSPECT_SCORE) + "）"
      + "；6.2 的及格线 = 标准1 加完抗压权重后的分（" + f1(BASE_SCORE) + " × " + f2(OUT_M.mul)
      + " = " + f1(OVER_SCORE) + " 分；标准1 本人就是抗压大师，所以枪法满 " + f1(BASE_SCORE) + " 分只到 6.1）"
      + "；越过 " + f1(OVER_SCORE) + " 记 6.2+，越过 " + f1(SUSPECT_SCORE) + "（+15%）记「数据有疑问」");
    const plus = g.bonus.filter(x => x.pts > 0.05).sort((a, b) => b.pts - a.pts);
    add("分级依据", plus.length
        ? "超过标准1的项：" + plus.map(x => x.k + "（标准1 " + (x.d === 2 ? f2(x.ref) : f1(x.ref)) + x.unit
            + "，本人 " + (x.d === 2 ? f2(x.v) : f1(x.v)) + x.unit + "，加分 +" + f1(x.pts) + "）").join("、")
          + (nx ? "；距下一档 " + nx.no + " " + nx.name + " 还差 " + f1(g.gap) + " 分" : "；已在表顶")
        : "六项加分项一项都没超过标准1（加分 0），差距全在枪法上"
          + (nx ? "；距下一档 " + nx.no + " " + nx.name + " 还差 " + f1(g.gap) + " 分" : "；已在表顶"));
    add("升级建议", g.g.need);
    if (g.suspect){
      add("数据存疑说明（必须写）", "总分 " + f1(g.raw) + " 比及格线（" + f1(OVER_SCORE) + " 分，= 标准1 加完抗压权重）高出 "
        + f1((g.raw / OVER_SCORE - 1) * 100) + "%，超过 15% 的线，按规则记「数据有疑问」。"
        + "正文里要写清「比标准1还高一成半以上，这个幅度不像真人打出来的」，但不要人身攻击，"
        + "给一句「样本可能有问题（人机局/代打/车队刷）」或「建议自查」即可");
    } else if (g.over){
      add("6.2+ 说明（必须写）", "总分 " + f1(g.raw) + " 已经超过及格线（" + f1(OVER_SCORE) + " 分，= 标准1 加完抗压权重），但没到 +15% 那条线，"
        + "按规则记「6.2+」，属于真人能打出来的上限，不许写成开挂，也不许说数据不干净");
    }
    if (g.selfBench){
      add("标准1本人", "这个号就是页面里写死的标准1（取样 " + num(BENCH.sample) + " 场），本身就是抗压大师，"
        + "总分固定 " + f1(OVER_SCORE) + " = 6.2 的及格线（" + f1(BASE_SCORE) + " × " + f2(OUT_M.mul) + "）。"
        + "正文里要说明他就是刻度本身，不要拿它跟自己比；称号照点，但要讲清「及格线就是按他定的」");
    }
  }
  if (V.cs && V.cs.played.length){
    const cs = V.cs;
    add("四国偏向", cs.tot + " 场里的分布：" + cs.played.map(x =>
        CN[x.c] + " " + x.n + " 场（" + f1(x.share) + "%）/ 胜率 " + f1(x.w) + "% / K/D " + f2(x.kd)
        + " / 场均 " + f1(x.avgK) + " 杀 / 点内 " + f1(x.pinRate) + "%").join("；")
      + "。主玩国 " + CN[cs.top.c] + "，偏向类型「" + cs.kind + "」，集中度 " + f1(cs.top.share) + "%"
      + (cs.best && cs.best.c !== cs.top.c
          ? "；最能打的是 " + CN[cs.best.c] + "（" + f1(cs.best.w) + "%），与主玩国不一致"
          : "；最能打的也是主玩国本身")
      + (cs.worst && cs.worst.c !== cs.top.c ? "；最弱是 " + CN[cs.worst.c] + "（" + f1(cs.worst.w) + "%）" : "")
      + "。生涯各国：" + cs.list.filter(x => x.cb > 0)
        .map(x => CN[x.c] + " " + num(x.cb) + " 场 / 胜率 " + f1(x.cw) + "% / KDA " + f2(x.ckd)).join("｜"));
  }
  if (V.env){
    const e = V.env, rf = e.replay || null;
    if (e.avgHumans != null){
      add("对局环境（真人规模）", "按战绩 " + e.n + " 场统计：每场双方合计平均 " + f1(e.avgHumans) + " 个真人（我方 "
        + f1(e.myHumans) + " / 对面 " + f1(e.opHumans) + "），最少一场 " + e.minHumans + " 个、最多 "
        + e.maxHumans + " 个，中位 " + e.medHumans + "；"
        + (e.avgHumans < 8 ? "活人极少，人机陪跑为主" : e.avgHumans < 14 ? "活人偏少，人机掺得多" : e.avgHumans < 18 ? "真人对抗为主" : "基本满编真人局")
        + "。口径：真人＝这一场战绩里查得到的玩家，人机没有战绩记录、不在这份名单里"
        + (rf ? "；回放 " + rf.n + " 场子样本里人机占 " + f1(rf.botRate) + "%（" + rf.bots + "/" + rf.seats
            + " 个席位），对面真人平均 " + f1(rf.realOpp) + " 个" : "；回放样本没取到，人机占比这项缺"));
    } else {
      add("对局环境（人机）", "回放样本 " + e.n + " 场（接口只保留最近 10 场，属于抽样，不是全量）：双方共 "
        + e.seats + " 个席位，其中人机 " + e.bots + " 个，占 " + f1(e.botRate) + "%；我方人机 " + e.myBots
        + "、对面人机 " + e.oppBots + "；平均每场 " + f1(e.avgBot) + " 个人机，对面真人平均 " + f1(e.realOpp) + " 个");
    }
    add("组队情况", e.fixed.length
      ? "固定队友 " + e.fixed.map(x => x.name + "（同队 " + x.n + " 场）").join("、")
        + "；" + e.teamGames + "/" + e.n + " 场有队友，最多一局带 " + e.squadMax + " 个"
      : (e.teamGames
          ? e.teamGames + "/" + e.n + " 场有队友，但没有固定搭档（路人拼车）"
          : "全是单排，一个固定队友都没有"));
  }
  if (items.length) add("加分/扣分项", items.join("；"));
  if (V.tags && V.tags.length) add("打法标签", V.tags.map(t => t.t).join("、"));

  if (D.segs && D.segs.length >= 3){
    const path = D.segs.slice().reverse().map(x => "胜率 " + f1(x.s.winRate) + "%（场均 " + Math.round(x.s.avgK) + " 杀）");
    add("分段走势（左旧右新）", path.join(" → "));
  }

  if (D.sq && D.sq.total){
    add("他的小队", "共 " + D.sq.total + " 支小队，氪金队 " + D.sq.paid + " 支（其中高级队 " + D.sq.pre + " 支）"
      + (Object.keys(D.sq.by).length ? "；氪金分布 " + Object.keys(D.sq.by).map(k => k + " " + D.sq.by[k]).join("｜") : ""));
  }

  if (D.clean.length >= 20){
    const hr = {};
    D.clean.forEach(r => { const h = new Date((r.commitTime || 0) * 1000).getHours(); hr[h] = (hr[h] || 0) + 1; });
    const top = Object.keys(hr).map(Number).sort((a, b) => hr[b] - hr[a]).slice(0, 3);
    const night = [0,1,2,3,4,5].reduce((acc, h) => acc + (hr[h] || 0), 0);
    add("作息", "最活跃 " + top.map(h => String(h).padStart(2, "0") + "点(" + hr[h] + ")").join(" / ")
      + "，凌晨场 " + night + " 场");
  }
  return L.join("\n");
}

/* ---------------- 评价体系（内嵌文本，单一来源） ----------------
   文档存在 id 为 rbDoc 的 text/plain 脚本块里，不参与 JS 解析，
   所以体系正文里出现任何符号都不会破坏页面。
   <<AI-CORE>> 与 <<AI-CORE-END>> 之间 = 喂给模型的体系正文。 */
const RB_OPEN = "<<AI-CORE>>", RB_CLOSE = "<<AI-CORE-END>>";
let RB_TAB = "core";

function rbRaw(){
  const el = document.getElementById("rbDoc");
  return el ? (el.textContent || "") : "";
}
function rbCore(){
  const t = rbRaw();
  const a = t.indexOf(RB_OPEN), b = t.indexOf(RB_CLOSE);
  if (a < 0 || b < 0) return "";
  return t.slice(a + RB_OPEN.length, b).trim();
}
function rbFull(){
  let t = rbRaw();
  t = t.split(RB_OPEN).join("").split(RB_CLOSE).join("");
  return t.trim();
}

/* 极简 markdown：标题 / 表格 / 列表 / 代码块 / 引用 / 分隔线 / 粗体 / 行内码 */
function rmd(src){
  const L = String(src).replace(/\r\n/g, "\n").split("\n");
  const inl = t => esc(t)
    .replace(/`([^`\n]+)`/g, (m, a) => "<code>" + a + "</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, (m, a) => "<strong>" + a + "</strong>");
  const cells = row => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(x => x.trim());
  const out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length){ out.push("<p>" + inl(para.join(" ")) + "</p>"); para = []; } };

  while (i < L.length){
    const t = L[i].trim();

    if (!t){ flush(); i++; continue; }

    if (t.indexOf("```") === 0){
      flush();
      const buf = []; i++;
      while (i < L.length && L[i].trim().indexOf("```") !== 0){ buf.push(L[i]); i++; }
      i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^#{1,6}\s/.test(t)){
      flush();
      const lv = t.match(/^#+/)[0].length;
      const txt = t.replace(/^#+\s*/, "");
      out.push(lv <= 2 ? "<h2>" + inl(txt) + "</h2>" : "<h3>" + inl(txt) + "</h3>");
      i++; continue;
    }
    if (/^(-{3,}|\*{3,})$/.test(t)){ flush(); out.push("<hr>"); i++; continue; }
    if (t.indexOf("|") === 0 && i + 1 < L.length && /^\|[\s:|-]+\|$/.test(L[i + 1].trim())){
      flush();
      const head = cells(t); i += 2;
      const rows = [];
      while (i < L.length && L[i].trim().indexOf("|") === 0){ rows.push(cells(L[i])); i++; }
      out.push("<table><thead><tr>" + head.map(c => "<th>" + inl(c) + "</th>").join("") + "</tr></thead><tbody>"
        + rows.map(r => "<tr>" + r.map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>").join("")
        + "</tbody></table>");
      continue;
    }
    if (t.indexOf("> ") === 0 || t === ">"){
      flush();
      const buf = [];
      while (i < L.length && L[i].trim().indexOf(">") === 0){
        buf.push(L[i].trim().replace(/^>\s?/, "")); i++;
      }
      out.push("<blockquote>" + inl(buf.join(" ")) + "</blockquote>");
      continue;
    }
    if (/^([-*+]|\d+\.)\s/.test(t)){
      flush();
      const ord = /^\d+\./.test(t);
      const buf = [];
      while (i < L.length && /^([-*+]|\d+\.)\s/.test(L[i].trim())){
        buf.push(L[i].trim().replace(/^([-*+]|\d+\.)\s+/, "")); i++;
      }
      const tag = ord ? "ol" : "ul";
      out.push("<" + tag + ">" + buf.map(x => "<li>" + inl(x) + "</li>").join("") + "</" + tag + ">");
      continue;
    }
    para.push(t); i++;
  }
  flush();
  return out.join("\n");
}

function rbRender(){
  const body = document.getElementById("rbBody");
  if (!body) return;
  const core = rbCore(), full = rbFull();
  const html = rmd(RB_TAB === "core" ? core : full);
  body.innerHTML = html || '<p style="color:var(--red)">体系文本缺失（rbDoc 为空）</p>';
  body.scrollTop = 0;
  document.querySelectorAll(".rb-tab").forEach(b =>
    b.classList.toggle("on", b.getAttribute("data-tab") === RB_TAB));
  const meta = document.getElementById("rbMeta");
  if (meta) meta.textContent = "正文 " + core.length + " 字 · AI 评价前会先整段读取"
    + (RB_TAB === "core" ? "" : " · 当前为完整文档");
  const note = document.getElementById("rbNote");
  if (note) note.textContent = RB_TAB === "core"
    ? "点「AI 重写」时，这一页会原样放进 system 作为前置规范"
    : "完整文档含可粘到别家模型的 SYSTEM / USER 模板";
}

function rbCopyText(txt, btn){
  const done = () => { const o = btn.textContent; btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => rbCopyLegacy(txt, done));
  } else rbCopyLegacy(txt, done);
}
function rbCopyLegacy(txt, done){
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}
function rbOpen(){
  const box = document.getElementById("rb");
  if (!box) return;
  rbRender();
  box.classList.add("open");
  document.body.style.overflow = "hidden";
}
function rbClose(){
  const box = document.getElementById("rb");
  if (!box) return;
  box.classList.remove("open");
  document.body.style.overflow = "";
}
function rbInit(){
  const box = document.getElementById("rb");
  if (!box) return;
  const op = document.getElementById("rbOpen");
  if (op) op.onclick = () => rbOpen();
  const cl = document.getElementById("rbClose");
  if (cl) cl.onclick = () => rbClose();
  box.addEventListener("click", e => { if (e.target === box) rbClose(); });
  document.querySelectorAll(".rb-tab").forEach(b => {
    b.onclick = () => { RB_TAB = b.getAttribute("data-tab"); rbRender(); };
  });
  const cp = document.getElementById("rbCopy");
  if (cp) cp.onclick = () => rbCopyText(RB_TAB === "core" ? rbCore() : rbFull(), cp);
  const rbtn = document.getElementById("rbOpen");
  if (rbtn) rbtn.classList.add("on");
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && box.classList.contains("open")) rbClose();
  });
  rbRender();
}

  const sys = [
    "你是《从军》(Enlisted) 国服的老玩家，在贴吧混了很多年，最擅长看战绩给人下判断，说话直接、有点损。",

    rubric ? "===== 评价体系 开始 =====\n" + rubric + "\n===== 评价体系 结束 =====" : "",
    "【风格硬要求，违反任何一条都算不合格】",
    "1. 篇幅 1000~1500 字，8~12 段；段落长短交错，禁止每段都是同一个句式结构（比如每段都以「XX 方面」开头）。",
    "2. 第一句直接下判断：他是哪一档、强在哪、弱在哪，一句话说完。禁止任何铺垫式开场。",
    "3. 禁用这些词和句式：首先、其次、再次、最后、综上所述、总的来说、值得注意的是、不难看出、从数据来看、"
      + "整体表现、综合来看、具有一定的、表现出色、有待提高、作为一名玩家、可以说、换言之。",
    "4. 不许用项目符号、编号列表、堆叠小标题；用自然段说话。小标题最多 2 个，可有可无。",
    "5. 每个判断后面要跟一个具体数字，数字要带对比（例：场均 133.9 杀，比同级平均高一倍），不要光报数。",
    "6. 至少三处只属于这个人的细节（某个比例特别高或特别低、某一段走势塌了、某个国家打得最多），"
      + "换个玩家就套不进去的那种。",
    "7. 必须写清两件事：他在 12 级表里的位置（几级几档），以及这一档的对战换算（打老兵/路人王要几个）。"
      + "再说明他距离下一档差哪一项，别泛泛地说「还需努力」。",
    "8. 结尾短、有态度，落地一句人话，不许重复开头。",
    "9. 不要复述体系内容，不要写「我已阅读评价体系」「根据体系要求」这类话，直接输出正文。",
    "10. 必须单独用一段讲四国偏向：他主玩哪国、偏到什么程度（集中度）、最能打的是不是主玩国；"
      + "如果爱玩的国不是最强的国，要直接点出来。结尾给一句「该多玩哪个、该少碰哪个」的具体建议。",
    "11. 必须单独用一段讲对局环境：每场双方有多少真人、对面真人平均几个、这数据有多少水分；"
      + "有回放子样本时再带上人机占比（人机只能从回放阵容看，别把真人数量说成人机占比）。"
      + "有固定车队要写清队友和同队场次，并说明「这不是纯单排数据」。"
      + "活人很少、人机占比高时，绝对不许把胜率和场均击杀当成纯个人实力吹。",
    "补充：数据里没有的东西（地图、武器型号、某场具体战例）一律不许编；所有数字都来自已算好的数据，不许重算。"
  ].filter(Boolean).join("\n");

  const user = "这是 " + D.name + " 的数据：\n\n" + aiFacts(D, V)
    + "\n\n请按上面的要求和体系里的分级标准，写一段 1000~1500 字的评价。";

  return [{ role: "system", content: sys }, { role: "user", content: user }];
}

/* 极简 markdown：只认 ## 小标题、**加粗**、空行分段 */
function mdLite(src){
  const lines = esc(src).split("\n");
  const out = [];
  let buf = [];
  const inline = l => l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^[-·]\s*/, "· ");
  const flush = () => { if (buf.length){ out.push("<p>" + buf.join("<br>") + "</p>"); buf = []; } };
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l){ flush(); return; }
    const h = l.match(/^#{1,4}\s*(.+)$/);
    if (h){ flush(); out.push("<h4>" + inline(h[1]) + "</h4>"); return; }
    buf.push(inline(l));
  });
  flush();
  return out.join("");
}

/* 「AI 思考中」至少停留多久：在下面两个数之间随机取一个（单位毫秒）。
   想让结果出得更快就改成 2000/3000，想更久就 12000/15000。 */
const AI_THINK_MIN = 5000, AI_THINK_MAX = 10000;

/* 「AI 思考中」占位：正文不立刻露，先让这个动画停留一会儿 */
function aiThinkHTML(){
  return '<div class="ai-think"><span class="tdots"><i></i><i></i><i></i></span>'

}

async function aiRun(D, V){
  if (AI_OFF) return;
  if (AI_RUN.on) return;
  /* 没测过连通性（或上次没测通）就不建这个框：先测一次，真通了才继续 */
  if (!aiOk()){
    toastLine("先测一下 AI 连通性…", "var(--dim)", 20000);
    /* 测不通就把规则文案填回去：正文此时还是骨架，不能一直空着 */
    if (!(await aiProbe())){ vdRestore(V); return; }
  }
  let box = $("#aiBox");
  if (!box){ vdRestore(V); return; }
  box.innerHTML = aiShell();
  const rbl = $("#aiRb");
  if (rbl) rbl.onclick = () => rbOpen();
  const body = $("#aiBody"), state = $("#aiState"), btn = $("#aiRe");
  const t0 = Date.now();
  /* 生成成功后交接：把「成分评价」卡里的正文换成 AI 版，AI 卡本身收掉，
     页面上只留一份评价；分数条 / 加分项 / 分级条是规则算的，一个字都不动 */
  const handoff = (txt) => {
    const vd = $("#vdBody");
    if (!vd) return false;
    vd.innerHTML = mdLite(txt)
      + '<div class="motto">-- 以上由 AI 按数据重写；总分与分级仍按规则计算 --</div>';
    vd.dataset.ai = "done";     // 标记成 AI 正文，后面失败回落时不会把这段覆盖掉
    const vc = $("#verdictCard");
    if (vc){
      const h2 = vc.querySelector("h2");
      if (h2) h2.innerHTML = "成分评价" + '<span class="ai-tag">AI 重写</span>';
      const go = vc.querySelector("#aiGo");
      if (go) go.textContent = "重新生成";
    }
    const bx = $("#aiBox");
    if (bx) bx.innerHTML = "";
    return true;
  };
  /* 正文不立刻露出来：先让「AI 思考中」停留 AI_THINK_MIN~AI_THINK_MAX 毫秒（每次随机），到点再显示 */
  const revealAt = t0 + AI_THINK_MIN
    + Math.floor(Math.random() * (AI_THINK_MAX - AI_THINK_MIN + 1));
  const waitReveal = () => new Promise(r => {
    const left = revealAt - Date.now();
    left > 0 ? setTimeout(r, left) : r();
  });
  AI_RUN.on = true;
  btn.disabled = true;

  /* key 没填：直接把改哪里说清楚，不发无谓请求 */
  if (!aiKey()){
    state.dataset.done = "1";
    state.textContent = "未配置 KEY";
    const hint = location.protocol === "file:"
      ? '双击同目录的 <code>设置DS配置.bat</code>，按提示粘贴 DeepSeek 的 key 后运行一次即可。'
      : '这个网页没内置 key：用一次 <code>…/#k=sk-你的key</code> 的地址打开，'
        + '它会把 key 存进你这台机器的浏览器，之后正常访问就行。';
    body.innerHTML = '<div class="ai-err">AI 还没配好 key。<br><br>' + hint
      + '<br><br>下面的评价已经换成规则版，不受影响。</div>';
    vdRestore(V);
    AI_RUN.on = false;
    btn.disabled = false;
    return;
  }

  state.textContent = "AI 思考中" + (aiModel() ? " · " + aiModel() : "");
  body.innerHTML = aiThinkHTML();

  const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  AI_RUN.ctrl = ctrl;
  const timer = setInterval(() => {
    if (state.dataset.done) return;
    const el = (Date.now() - t0) / 1000;
    const revealed = state.dataset.revealed === "1";
    state.textContent = (revealed ? "生成中 " : "AI 思考中 ") + el.toFixed(0) + "s";
    const sec = $("#aiThinkSec");
    if (sec) sec.textContent = el.toFixed(0) + "s";
  }, 300);

  try{
    const hdr = { "Content-Type": "application/json" };
    const sk = aiKey();
    if (sk) hdr["Authorization"] = "Bearer " + sk;   // 直连中转站时由浏览器自己带 key
    const mdl = aiModel();
    const msgs = aiMessages(D, V);
    /* 有些推理模型（gpt-5 系 / o 系）不接受 temperature 或 max_tokens，
       会把整个请求判成参数错误。所以先按常规发，碰到参数类报错就降级重发一次。 */
    const mkBody = (full) => {
      const b = { messages: msgs, stream: true };
      if (mdl) b.model = mdl;
      if (full){ b.temperature = 0.9; b.max_tokens = 4000; }
      return JSON.stringify(b);
    };
    const post = (full) => fetch(aiEndpoint(), {
      method: "POST",
      headers: hdr,
      body: mkBody(full),
      signal: ctrl ? ctrl.signal : undefined
    });
    let res = await post(true);
    if (!res.ok){
      let first = "HTTP " + res.status, raw = "";
      try{
        raw = await res.text();
        const j = JSON.parse(raw);
        const e2 = j && (j.error || j);
        if (typeof e2 === "string") first = e2;
        else if (e2 && e2.message) first = e2.message;
        else if (j && j.msg) first = j.msg;
      }catch(e){ first = raw ? raw.slice(0, 200) : first; }
      /* 400/422 且提到参数 → 去掉 temperature / max_tokens 再试一次 */
      const paramIssue = (res.status === 400 || res.status === 422)
        && /temperature|max_tokens|max_completion_tokens|unsupported|invalid.*(param|value)|not support/i.test(first);
      if (paramIssue){
        state.textContent = "模型不接受默认参数，正在降级重试…";
        const res2 = await post(false);
        if (res2.ok){ res = res2; }
        else {
          let m2 = "HTTP " + res2.status;
          try{
            const j2 = await res2.json();
            const e3 = j2 && (j2.error || j2);
            if (typeof e3 === "string") m2 = e3;
            else if (e3 && e3.message) m2 = e3.message;
          }catch(e){}
          throw new Error(m2 + "（已自动去掉 temperature/max_tokens 仍失败）");
        }
      } else {
        if (res.status === 401 || res.status === 403) first += "（KEY 无效、过期，或账户没余额）";
        if (mdl && /model/i.test(first)) first += "（请求的模型名是 " + mdl + "，核对中转站模型列表是否一致）";
        throw new Error(first);
      }
    }
    let finalTxt = "";
    if (!res.body) { // 老浏览器兜底：整体读
      const j = await res.json();
      const txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || "";
      await waitReveal();
      finalTxt = txt;
      body.innerHTML = mdLite(txt);
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder("utf-8");
      let acc = "", think = "", buf = "", dirty = false;
      const paint = (force) => {
        /* 还没到显示时间就继续显示「思考中」，内容先攒着 */
        if (!force && Date.now() < revealAt) return;
        if (!dirty && !force) return;
        state.dataset.revealed = "1";
        dirty = false;
        body.innerHTML = mdLite(acc) + '<span class="caret"></span>';
      };
      const tick = setInterval(paint, 90);
      while (true){
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        const parts = buf.split("\n");
        buf = parts.pop();
        for (const line of parts){
          const t = line.trim();
          if (!t || t.startsWith(":")) continue;
          if (!t.startsWith("data:")) continue;
          const d = t.slice(5).trim();
          if (!d || d === "[DONE]") continue;
          try{
            const o = JSON.parse(d);
            const dl = o.choices && o.choices[0] && o.choices[0].delta || {};
            const c = dl.content;
            if (c){ acc += c; dirty = true; }
            /* 推理模型会先把思考过程放在 reasoning_content 里，正文可能要走完才吐 */
            if (dl.reasoning_content) think += dl.reasoning_content;
          }catch(e){ /* 半包忽略 */ }
        }
      }
      clearInterval(tick);
      await waitReveal();                 // 内容早到了，也把「思考中」停满 5~10 秒
      /* 极少数模型只回思考不回正文：拿思考内容兜底，总比一片空白强 */
      if (!acc.trim() && think.trim()) acc = think;
      if (!acc.trim()) throw new Error("模型返回为空（key 过期、模型名不对，或上游拒了这个接口）");
      finalTxt = acc;
      paint(true);
      const cur = body.querySelector(".caret");   // 收尾不留闪烁光标
      if (cur) cur.remove();
    }
    state.dataset.done = "1";
    /* 显示你实际等的时间（含那段刻意的思考停留），比只报模型耗时更符合直觉 */
    state.textContent = "AI 生成 · " + ((Date.now() - t0) / 1000).toFixed(1) + "s";
    /* 正文搬到上面那张评价卡里，AI 卡收掉——页面上只留一份评价 */
    handoff(finalTxt);
  }catch(e){
    state.dataset.done = "1";
    state.textContent = "失败";
    const m = String(e && e.message || e);
    const net = /Failed to fetch|NetworkError|Load failed|fetch failed|Network request failed/i.test(m);
    let tip;
    tip = "直连 DeepSeek，常见原因：① key 无效 / 余额不足（401、402）—— 去 platform.deepseek.com 看一眼；"
      + "② 模型名不对（当前 <code>" + (aiModel() || "未填") + "</code>，可用 deepseek-chat / deepseek-v4-pro）；"
      + "③ 地址应为 <code>https://api.deepseek.com/v1</code>（不要少了 /v1）；"
      + "④ 网络或代理拦了 api.deepseek.com —— 换个网络、关掉代理再试。"
      + (net ? "<br><br><b>这次是压根没连上</b>，多半是 ④。" : "");
    body.innerHTML = '<div class="ai-err">AI 这步没成功：' + esc(m) + "<br><br>" + tip
      + "<br><br>上面的评价已换回规则版，内容照旧能看。"
      + "AI 已临时关闭：修好后点右上「测试 AI 连通性」，测通了下次查询才会再自动生成。</div>";
    /* 正文此时还是骨架，必须换回规则文案，否则整张评价卡空着 */
    vdRestore(V);
    /* 失败就不再自动跑：回到「没测通」的状态，下次查询不建这个框，免得每次都弹一坨报错 */
    aiSetOk(false);
    const dd = $("#aiDot"); if (dd) dd.className = "dot err";
  }finally{
    clearInterval(timer);
    AI_RUN.on = false;
    AI_RUN.ctrl = null;
    btn.disabled = false;
    btn.textContent = "重写";
  }
}

function aiBind(D, V){
  if (AI_OFF) return;
  const go = document.getElementById("aiGo");
  if (go) go.onclick = () => { if (!document.getElementById("aiBox")) {
      const d = document.createElement("div"); d.id = "aiBox"; document.getElementById("result").appendChild(d);
    } aiRun(D, V); };
  const re = document.getElementById("aiRe");
  if (re) re.onclick = () => aiRun(D, V);
}

/* ---------------- 主流程 ---------------- */
let busy = false;
let LAST = null;          // { D, V } 最近一次分析结果，供"AI 重写"按钮复用（规则版也要用，别放进 AI 段）
let LASTQ = null;         // { q, uid, n } 最近一次查询参数：TOKEN 换好后按它自动重查
async function analyze(target, n){
  if (busy) return;
  if (!token()){ $("#tkPanel").classList.add("open"); openTkDlg(); return; }
  target = (target || "").trim();
  if (!target) return;
  LASTQ = { q: target, uid: /^\d{3,}$/.test(target) ? target : null, n: n };
  busy = true;
  $("#go").disabled = true;
  $("#go").textContent = "查询中…";
  stReset();
  $("#result").innerHTML = "";

  RUN.cancelled = false;
  RUN.abort = (typeof AbortController !== "undefined") ? new AbortController() : null;
  ovlOpen("正在查询 " + target, "解析身份 → 概览 → 战绩 → 小队");

  try{
    const s1 = stLine("解析身份：" + esc(target));
    let rg, roll = null;
    try{
      rg = await resolveUid(target, msg => {
        /* 搜索过程全部进加载框：换环节就新增一行，同一环节的滚动进度（x/y、…）原地更新 */
        const tick = /[0-9]+\s*\/\s*[0-9]+/.test(msg) || /…$/.test(msg);
        if (!roll){
          roll = ovlLine(msg);
        }else if (tick && roll._tick){
          stSet(roll, msg); roll._txt = msg;
        }else{
          stSkip(roll, roll._txt || "已试过");   // 上一步走完（试过），保留原文
          roll = ovlLine(msg);
        }
        if (roll) roll._tick = tick;
        ovlSub(msg);
        ovlTick();
      });
      if (roll) stSkip(roll, roll._txt || "已确认");
      stDone(s1, "UID " + rg.uid + (rg.name ? "（" + rg.name + "）" : "") + " · 来源 " + rg.src);
    }catch(e){
      if (RUN.cancelled) throw e;
      if (roll) stSkip(roll, roll._txt || "已中断");
      stFail(s1, "解析身份失败：" + e.message); throw e;
    }
    ovlStage(); ovlSub("身份已确认：UID " + rg.uid);

    const uid = rg.uid;
    if (LASTQ) LASTQ.uid = uid;
    ovlSub("拉取生涯概览 overview");
    const s2 = stLine("拉取生涯概览");
    const ov = await api("/cj-record-rankings/combat/overview", { uid: uid });
    stDone(s2, "概览：" + num(ov.sumBattles || 0) + " 场，胜率 " + (ov.sumVict || "-") + "%");
    ovlStage();

    ovlSub("拉取最近 " + n + " 场战绩 hisBattles");
    const s3 = stLine("拉取最近 " + n + " 场战绩");
    const bd = await api("/cj-record-rankings/combat/hisBattles", { uid: uid, pageSize: n, pageNum: 1 });
    const rows = (bd.data || []).sort((a, b) => (b.commitTime || 0) - (a.commitTime || 0));
    stDone(s3, "拿到 " + rows.length + " 条记录（可查 " + num(bd.total || 0) + " 条）");
    ovlStage();

    ovlSub("拉取小队数据 mySquad");
    const s4 = stLine("拉取小队数据");
    let sqRaw = [];
    try{
      const sd = await api("/cj-record-rankings/combat/mySquad", { uid: uid });
      sqRaw = sd.squads || [];
      stDone(s4, "小队 " + sqRaw.length + " 支");
    }catch(e){
      if (RUN.cancelled) throw e;
      stFail(s4, "小队数据取不到：" + e.message);
    }
    ovlStage();

    ovlSub("统计对局环境（真人规模 / 组队）");
    const s4b = stLine("统计对局环境（真人规模 / 组队）");
    let env = null, replayEnv = null;

    /* ① 回放样本：现在只用来算人机占比 + 给隐身号补昵称（每人最多 10 场，天然是子样本） */
    try{
      let rpLine = null;
      replayEnv = await scanEnv(uid, rg.name, msg => {
        if (!rpLine) rpLine = stLine(msg, "", true); else stSet(rpLine, msg);
        ovlSub(msg); ovlTick();
      });
      if (replayEnv) stSkip(rpLine, "回放样本 " + replayEnv.n + " 场（只用于人机占比）");
      else stSkip(rpLine, "没有可用的回放样本，人机占比这项空着");
    }catch(e){
      if (RUN.cancelled) throw e;
      replayEnv = null;
    }
    ovlStage();

    /* ② 按查询的 N 场战绩逐场取阵容：真人规模 + 固定队友 */
    try{
      let envLine = null;
      env = await scanBattleEnv(rows, uid, msg => {
        if (!envLine) envLine = stLine(msg, "", true); else stSet(envLine, msg);
        ovlSub(msg); ovlTick();
      });
      if (env){
        stDone(envLine, "战绩 " + env.n + " 场");
        stDone(s4b, "对局环境：" + env.n + " 场 · 平均真人 " + f1(env.avgHumans) + "/场（我方 "
          + f1(env.myHumans) + " / 对面 " + f1(env.opHumans) + "）· 固定队友 " + env.fixed.length + " 人"
          + (replayEnv ? " · 回放样本人机 " + f1(replayEnv.botRate) + "%" : ""));
      } else {
        stSkip(envLine, "这批战绩里取不到对局阵容");
        stSkip(s4b, "跳过对局环境（battleDetail 没返回阵容）");
      }
    }catch(e){
      if (RUN.cancelled) throw e;
      stFail(s4b, "对局环境统计失败：" + e.message);
    }
    if (env && replayEnv) env.replay = replayEnv;
    else if (!env && replayEnv) env = replayEnv;
    ovlStage();

    if (!rows.length) throw new Error("没有逐场记录");

    /* 只给 UID 的情况（隐身号）：昵称从回放阵容里补回来，标注来源，不当作已确认的昵称 */
    if (!rg.name && replayEnv && replayEnv.myName){
      rg.name = replayEnv.myName;
      rg.src = rg.src + "（昵称取自最近回放，隐身号每局可能不同）";
      stLine("昵称：" + esc(rg.name) + " · 从最近回放阵容里认出来的");
    }

    /* 逐场定权：拿到阵容的场次按「双方真人总数」打折（<7 人的局降权），拿不到的按满权 */
    const humOf = {};
    if (env && env.recs) env.recs.forEach(x => { humOf[x.sid] = x.n; });
    rows.forEach(r => { r.__w = wOfHumans(humOf[r.sessionId]); });

    const flee = rows.filter(isFlee);
    const quick = rows.filter(isQuick);
    const clean = rows.filter(r => !isFlee(r));
    const sq = squadStats(sqRaw);
    const segs = segments(clean, 4);

    const D = {
      uid: uid, name: rg.name || ("UID " + uid), src: rg.src,
      srcWhen: rg.when, srcMap: rg.map, weak: rg.weak, weakNote: rg.weakNote,
      ov: ov, country: countryStats(clean, ov), env: env,
      rows: rows, clean: clean, flee: flee, quick: quick, sq: sq, segs: segs
    };

    ovlSub("生成成分评价");
    const s5 = stLine("生成成分评价");
    const V = buildVerdict(D);
    stDone(s5, "完成：" + V.title + "（" + Math.round(V.grade ? V.grade.v : V.sc) + " 分）");

    $("#result").innerHTML =
      renderIdentity(D) + renderOverview(ov, D.name) + renderBattles(D)
      + renderCountry(D) + renderEnv(D) + renderSquads(sq) + renderVerdict(V)
      + '<div id="aiBox"></div>';

    LAST = { D: D, V: V };
    aiBind(D, V);

    ovlSettle("done");
    $("#ovlTitle").textContent = "查询完成";
    $("#ovlSub").textContent = (rg.name || ("UID " + uid)) + " · " + V.title + "（" + Math.round(V.grade ? V.grade.v : V.sc) + " 分）";
    $("#ovlTime").textContent = "共 " + ((Date.now() - OVL.t0) / 1000).toFixed(1) + " 秒";
    await sleep(420);
    ovlClose();

    if (aiAuto()) aiRun(D, V);

    // 历史
    if (rg.name) addHist(rg.name, n);
    else addHist(String(uid), n);

  }catch(e){
    if (RUN.cancelled){
      ovlClose();
      $("#status").classList.remove("show");
      $("#result").innerHTML = '<div class="card"><div class="empty"><div class="big">—</div>'
        + "<p>查询已取消。</p>"
        + '<p style="margin-top:10px;font-size:13px;color:var(--dim2)">接口本身有延迟，读录像阵容和翻排行榜时尤其慢；'
        + "换个名字或稍后再试。</p></div></div>";
      return;
    }
    ovlSettle("fail");
    $("#ovlTitle").textContent = "查询失败";
    $("#ovlSub").textContent = e.message || "未知错误";
    /* 失败时把搜索过程留在框里让人看清楚，按钮改成「关闭」，不会自己弹走 */
    const cb = $("#ovlCancel");
    cb.disabled = false;
    cb.textContent = "关闭";
    cb.onclick = () => { if (OVL.on) ovlClose(); };
    await sleep(5000);   // 留 5 秒让人看清搜索过程（点「关闭」可以提前走）
    const bad = /500100/.test(e.message || "");
    if (bad){ TK_BAD = true; TK_RETRY = LASTQ; refreshTokenUI(); }
    $("#result").innerHTML = '<div class="card"><div class="empty"><div class="big">!</div>'
      + "<p style=\"color:var(--red)\">" + esc(e.message) + "</p>"
      + (bad
        ? '<p style="margin-top:10px;font-size:14px;color:var(--prose);line-height:1.85">TOKEN 是限时的，过期之后所有接口都会回 500100。<br>'
          + '点下面按钮，用书签从已登录的战火页面自动取一份新的；验证通过后会把这一次自动重查一遍。</p>'
          + '<button class="btn" id="tkFix" style="margin-top:15px">自动提取 TOKEN 并重查</button>'
        : '<p style="margin-top:10px;font-size:13px;color:var(--dim2)">若提示 500100 或 token 相关，请点右上角检查 TOKEN；'
          + "若提示找不到昵称，注意昵称<b>大小写敏感</b>——录像和排行榜都查不到时才会报「无法搜索该用户」，"
          + "这种情况把昵称反馈给作者，我再想办法。</p>")
      + "</div></div>";
    const fx = document.getElementById("tkFix");
    if (fx) fx.onclick = () => { $("#tkPanel").classList.add("open"); openTkDlg(); };
  }finally{
    busy = false;
    RUN.abort = null;
    $("#go").disabled = false;
    $("#go").textContent = "开始分析";
    if (OVL.on) ovlClose();
  }
}

/* ---------------- 历史 ---------------- */
function getHist(){ try{ return JSON.parse(localStorage.getItem("cj_hist") || "[]"); }catch(e){ return []; } }
function addHist(name, n){
  let h = getHist().filter(x => x.name !== name);
  h.unshift({ name: name, n: n });
  h = h.slice(0, 12);
  localStorage.setItem("cj_hist", JSON.stringify(h));
  renderHist();
}
function renderHist(){
  const box = $("#hist");
  if (!box) return;                    // 「近期查询记录」已从页面移除，只往 localStorage 里记，不再展示
  const h = getHist();
  if (!h.length){ box.innerHTML = ""; return; }
  box.innerHTML = h.map(x =>
    '<button data-n="' + esc(x.name) + '" data-c="' + x.n + '">' + esc(x.name) + "</button>").join("");
}

/* ================= TOKEN 自动提取 =================
   浏览器不允许一个页面读另一个 origin 的存储，所以「自动提取」只能在 act.zhanhuo.com
   那边执行：给一个书签，点一下把本机存着的 JWT 全翻出来，逐个拿去 cjapi 验，把能用的那份
   复制到剪贴板；这边切回来粘贴（或直接读剪贴板）就完成填充 + 验证 + 保存。
   书签源码放在 <script type="text/plain" id="tkBmSrc"> 里，避免一长串转义；运行时替换 __API__ / __UID__。 */
let TK_RETRY = null;      // 500100 失败时记下这次查询，换好 TOKEN 后自动重跑
let TK_WAIT = false;      // 弹窗开着、等用户去别的标签页取 TOKEN
let TK_TRY = 0;           // 读剪贴板的节流时间戳
let TK_AUTO = 0;          // 自动读剪贴板已试次数（每次开弹窗重置，最多两次，免得不弹权限还反复弹）

function tkBmCode(){
  const el = document.getElementById("tkBmSrc");
  if (!el) return "";
  const uid = (LASTQ && LASTQ.uid) || "1804096";
  return el.textContent.replace(/\s*\n\s*/g, " ")
    .replace("__API__", API)
    .replace("__UID__", String(uid))
    .trim();
}

/* 从一堆粘贴物里认出 TOKEN：允许带 CJTOKEN: 前缀、Bearer 前缀、引号、换行 */
function tkNorm(raw){
  let s = String(raw == null ? "" : raw).trim().replace(/^["'`]+|["'`]+$/g, "");
  s = s.replace(/^CJTOKEN\s*:\s*/i, "").replace(/^bearer\s+/i, "").trim();
  const m = s.match(/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}/);
  return m ? m[0] : "";
}

function tkSt(cls, html){
  const el = document.getElementById("tkdSt");
  if (!el) return;
  el.className = "tkd-st" + (cls ? " " + cls : "");
  el.innerHTML = html;
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){ }
  try{
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return !!ok;
  }catch(e){ return false; }
}

/* 探活：拿一个已知存在的 UID 请求 1 条战绩，code===0 就算这份 TOKEN 能用 */
async function verifyToken(v){
  const uid = (LASTQ && LASTQ.uid) || "1804096";
  try{
    const r = await fetch(API + "/cj-record-rankings/combat/hisBattles?uid=" + uid + "&pageSize=1&pageNum=1",
      { headers: { "accept": "application/json", "authorization": "Bearer " + v } });
    const j = await r.json();
    if (j && j.code === 0) return { ok: true };
    return { ok: false, msg: "服务端返回 code=" + (j && j.code) + " " + ((j && j.msg) || "") };
  }catch(e){
    return { ok: false, netFail: true, msg: fetchHint("验证请求失败：" + (e && e.message ? e.message : e)) };
  }
}

/* 存 + 验 + （有上次失败就）重查 */
async function tkApply(raw){
  const v = tkNorm(raw);
  if (!v) return false;
  localStorage.setItem("cj_token", v);
  TK_BAD = false;
  refreshTokenUI();
  tkSt("", "✓ 提取成功，正在验证…");
  const r = await verifyToken(v);
  if (r.ok){
    TK_WAIT = false;
    const rerun = TK_RETRY;
    TK_RETRY = null;
    tkSt("ok", "✓ 提取成功，已自动保存并通过验证。"
      + (rerun ? "马上把刚才那次查询重跑一遍…" : ""));
    setTimeout(() => {
      closeTkDlg();
      if (rerun && !busy) analyze(rerun.uid ? String(rerun.uid) : rerun.q, rerun.n);
    }, rerun ? 600 : 1100);
  }else{
    /* 500100 是明确判死：把顶栏也切成失效态，别让人以为已经换好了 */
    if (/500100/.test(r.msg || "")){ TK_BAD = true; refreshTokenUI(); }
    if (r.netFail && PREVIEW_ENV){
      /* 连不上不是 TOKEN 的问题：已经存好了，但存的是预览面板这个域的存储，
         切到 file:// 打开时读不到，得再粘一次（剪贴板里还在） */
      tkSt("", "✓ 已存下这份 TOKEN。只是连不上接口 —— " + esc(PREVIEW_MSG) + "。<br>"
        + "提示：预览面板和本地文件不是同一个域，存储不互通，切过去打开后<b>再按一次 <code>Ctrl+V</code></b>（剪贴板里还在）。");
      return false;
    }
    tkSt("bad", "已保存，但验证没通过：" + esc(r.msg)
      + "。如果这份是刚复制的，可能只是服务端抖了一下，直接查询试试；<br>"
      + "还是 500100 就说明战火那边登录过期了，重新登录再点一次书签。");
  }
  return r.ok;
}

async function tkReadClipboard(silent){
  if (Date.now() - TK_TRY < 3000) return false;
  TK_TRY = Date.now();
  if (!navigator.clipboard || !navigator.clipboard.readText){
    if (!silent) tkSt("bad", "这个浏览器不让脚本读剪贴板。直接按 <code>Ctrl+V</code>，粘在本页<b>任意位置</b>都能识别。");
    return false;
  }
  try{
    const t = await navigator.clipboard.readText();
    if (!tkNorm(t)){
      if (!silent) tkSt("bad", "剪贴板里现在没有 TOKEN。先在上面第 2 步点一下书签，它会自动复制。");
      return false;
    }
    return await tkApply(t);
  }catch(e){
    if (!silent) tkSt("bad", "浏览器拒绝了读剪贴板（用本地文件打开时几乎都会拒）。按 <code>Ctrl+V</code> 粘在本页任意位置，一样会自动填充保存。");
    return false;
  }
}

function openTkDlg(){
  let el = document.getElementById("tkDlg");
  if (!el){
    el = document.createElement("div");
    el.id = "tkDlg";
    document.body.appendChild(el);
  }
  el.innerHTML = tkDlgHTML();
  el.classList.add("on");
  document.body.style.overflow = "hidden";
  TK_WAIT = true;
  TK_AUTO = 0;

  const code = tkBmCode();
  const a = document.getElementById("tkdBm");
  if (a){
    a.setAttribute("href", code);
    a.onclick = e => {
      e.preventDefault();
      tkSt("", "书签不用在本页点 —— 把它拖到书签栏，再去 act.zhanhuo.com 点。");
    };
  }
  const cp = document.getElementById("tkdCopy");
  if (cp) cp.onclick = async () => {
    const ok = await copyText(code);
    if (ok){
      tkSt("ok", "✓ 书签代码已复制。书签栏右键 → 添加网页 / 添加书签，名称随意，网址粘这段。");
    }else{
      const ta = document.getElementById("tkdCode");
      if (ta){ ta.style.display = "block"; ta.value = code; ta.focus(); ta.select(); }
      tkSt("bad", "复制失败了，下面框里的代码已选中，手动 <code>Ctrl+C</code>。");
    }
  };
  const rd = document.getElementById("tkdRead");
  if (rd) rd.onclick = () => tkReadClipboard(false);
  const x = document.getElementById("tkdX");
  if (x) x.focus();
}

function closeTkDlg(){
  const el = document.getElementById("tkDlg");
  if (!el || !el.classList.contains("on")) return;
  el.classList.remove("on");
  document.body.style.overflow = "";
}

document.addEventListener("click", e => {
  const el = document.getElementById("tkDlg");
  if (!el || !el.classList.contains("on")) return;
  if (e.target.closest && e.target.closest("#tkdX")) closeTkDlg();
  else if (e.target === el) closeTkDlg();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("tkDlg")?.classList.contains("on")) closeTkDlg();
});
/* 从别的标签页切回来，先试着直接读剪贴板（读不到就让用户自己 Ctrl+V） */
function tkAutoRead(){
  if (!TK_WAIT || TK_AUTO >= 2) return;
  TK_AUTO++;
  tkReadClipboard(true);
}
window.addEventListener("focus", tkAutoRead);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tkAutoRead(); });
/* 全局粘贴：任意位置粘到 TOKEN 都能接住 */
window.addEventListener("paste", e => {
  const dt = e.clipboardData;
  if (!dt) return;
  const raw = dt.getData("text/plain") || dt.getData("text") || "";
  if (!tkNorm(raw)) return;
  e.preventDefault();
  if (document.getElementById("tkDlg")?.classList.contains("on")) tkApply(raw);
  else { openTkDlg(); tkApply(raw); }
});
$("#tkGrab").onclick = () => openTkDlg();

refreshTokenUI();
renderBench();
rbInit();
refreshAiUI();
if ($aiAuto) $aiAuto.checked = aiAuto();
/* 上次测通过就一直记着：顶部圆点直接标绿，表示「AI 已启用，查完会自动生成」
   没测过就保持熄灭 —— 那种情况下查完不出现 AI 框，也不发请求 */
(function(){
  const d = document.getElementById("aiDot");
  if (d && !AI_OFF && aiOk()) d.className = "dot on";
})();
/* 规则版：把 AI 相关的入口整块摘掉（代码留着但永不触发，不发任何请求） */
if (AI_OFF){
  ["aiTestTop", "aiSetBlock"].forEach(id => {
    const e = document.getElementById(id);
    if (e) e.remove();
  });
}
renderHist();

/* 预览面板里打开时，接口一定连不通（CSP 拦了 connect-src），提前把话说明白，
   省得每次查询都像「TOKEN 又失效了」。只在预览环境插入，本地双击打开不会出现。 */
if (PREVIEW_ENV && !document.getElementById("pvNote")){
  const bar = document.createElement("div");
  bar.id = "pvNote";
  bar.style.cssText = "margin:14px auto 0;max-width:1180px;padding:10px 14px;border-radius:10px;"
    + "border:1px solid rgba(220,185,110,.45);background:rgba(220,185,110,.1);color:var(--amber);"
    + "font-size:13px;line-height:1.7;display:flex;gap:12px;align-items:flex-start";
  bar.innerHTML = '<span style="flex:1">现在是在<b>预览面板</b>里打开的：它的安全策略不允许连 cjapi，'
    + "查询和 TOKEN 验证都会报「Failed to fetch」（跟 TOKEN 无关）。"
    + "双击 <code>成分分析.html</code> 用 Chrome / Edge 打开就正常 —— "
    + "注意这里粘的 TOKEN 也带不过去（不是同一个域），到那边再按一次 <code>Ctrl+V</code>。</span>"
    + '<button id="pvNoteX" style="flex:0 0 auto;border:1px solid rgba(220,185,110,.45);background:transparent;'
    + 'color:var(--amber);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:12.5px">知道了</button>';
  const hd = document.querySelector("header");
  if (hd && hd.parentNode) hd.parentNode.insertBefore(bar, hd.nextSibling);
  const bx = bar.querySelector("#pvNoteX");
  if (bx) bx.onclick = () => bar.remove();
}
// 支持 ?q=昵称 / ?uid=数字 直接查询
const qp = new URLSearchParams(location.search);
if (qp.get("uid")){
  const u = String(qp.get("uid")).replace(/\D/g, "");
  $("#qu").value = u;
  if (u) analyze(u, parseInt(qp.get("n")) || 100);
} else if (qp.get("q")){
  $("#q").value = qp.get("q");
  if (token()) analyze(qp.get("q"), parseInt(qp.get("n")) || 100);
}
</script>
