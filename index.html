<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 自动生成：由 生成线上版.py 从 成分分析.html 派生，唯一区别是 AI_CFG.key 为空。改逻辑请改主文件，别直接改这里。 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从军 · 成分分析</title>
<style>
:root{
  /* 长时间阅读的三条底线（照着眼睛舒适度的通行做法定的）：
     ① 暗底正文按 AAA（≥7:1）做，不按 WCAG 的 4.5:1 —— 亮字在暗底会「泛光」(halation)，
        边缘发虚，同样的对比度读起来更吃力；底色也不用纯黑，抬到 8% 左右亮度。
     ② 等宽字体只给数字用。中文绝不能落进等宽栈的兜底（Windows 上是宋体，12px 就是毛边），
        所以 --mono 里显式跟上中文无衬线兜底。
     ③ 正文 15px / 行高 1.75 起步，长段落行宽压到 40 字上下，换行时眼睛才不丢锚点。 */
  color-scheme:dark;
  --bg:#17191a; --panel:#1e2123; --panel2:#262a2c; --line:#343a3c;
  --input:#141617;
  --txt:#e2e7e3; --dim:#adb6b0; --dim2:#939d96; --prose:#d6ddd8;
  --green:#96c47a; --green-d:#5f8d47; --red:#e39a9a; --amber:#dcb96e;
  --blue:#8ab7e4; --purple:#b9a5e0;
  --sans:"MiSans","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SFMono-Regular",Menlo,"Microsoft YaHei UI","PingFang SC",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);}
body{
  font-family:var(--sans);
  font-size:15px; line-height:1.75; letter-spacing:.012em;
  background-image:radial-gradient(ellipse 900px 500px at 50% -10%,rgba(150,196,122,.035),transparent 70%);
  min-height:100vh;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(23,25,26,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:9px}
.logo b{font-size:18px;letter-spacing:.5px}
.logo b span{color:var(--green)}
.logo i{font-style:normal;font-size:12px;color:var(--dim2);letter-spacing:2px;font-family:var(--mono)}
.hd-sp{flex:1}
.tk-btn{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
  font-size:13px;cursor:pointer;transition:.18s;font-family:inherit;
}
.tk-btn:hover{border-color:var(--green-d);color:var(--txt)}
/* 右上角圆形图标按钮（评价体系） */
.hbtn{
  width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font:600 14px/1 var(--mono);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:.18s;padding:0;
}
.hbtn:hover{border-color:var(--green-d);color:var(--green);background:rgba(150,196,122,.08)}
.hbtn.on{border-color:var(--green-d);color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(150,196,122,.8)}
.dot.err{background:var(--red);box-shadow:0 0 8px rgba(255,92,92,.7)}

/* ---------- token panel ---------- */
#tkPanel{
  display:none;border-bottom:1px solid var(--line);background:var(--panel);
}
#tkPanel.open{display:block}
#tkPanel .in{max-width:1120px;margin:0 auto;padding:16px 20px}
#tkPanel label{display:block;font-size:13px;color:var(--dim);margin-bottom:7px}
.tk-row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=password]{
  flex:1;min-width:220px;padding:10px 13px;border-radius:8px;
  border:1px solid var(--line);background:var(--input);color:var(--txt);
  font-family:var(--mono);font-size:13px;outline:none;transition:.18s;
}
input[type=text]:focus,input[type=password]:focus{border-color:var(--green-d);box-shadow:0 0 0 3px rgba(95,141,71,.12)}
.hint{font-size:12.5px;color:var(--dim2);margin-top:9px;line-height:1.7}
.hint code{color:var(--amber);font-family:var(--mono);font-size:12px}

/* ---------- search ---------- */
.search{
  margin:34px 0 0;padding:22px;border-radius:14px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));
}
.search h1{font-size:21px;font-weight:600;letter-spacing:.3px;margin-bottom:5px}
.search p{font-size:13.5px;color:var(--dim);margin-bottom:17px}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.search-row input[type=text]{font-family:inherit;font-size:15px;padding:12px 15px;flex:1;min-width:200px}
/* 注意：要用 input.num 提高权重，否则被上面 input[type=text] 的 flex:1 抢走宽度 */
.search-row input.num{width:180px;min-width:180px;flex:none;font-family:var(--mono);text-align:center;font-size:14px;padding-left:8px;padding-right:8px}
.search-row input.num::placeholder{font-family:inherit;font-size:13px;letter-spacing:0;color:var(--dim2);opacity:1}
.uid-tip{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--dim2)}
.uid-tip b,.uid-tip code{color:var(--dim)}

/* ---------- 评分标尺卡（写死在页面里的基准玩家） ---------- */
.bench{margin-top:16px;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.bench::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--amber),rgba(220,185,110,0))}
.bench-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bench-h b{font-size:15px;letter-spacing:.2px}
.bench-h .sub{font-size:13px;color:var(--dim);font-family:var(--mono);letter-spacing:.01em}
.bench-h .gr{margin-left:auto;font-size:13px;color:var(--amber);border:1px solid rgba(220,185,110,.42);border-radius:20px;padding:2px 10px;background:rgba(220,185,110,.1);white-space:nowrap}
.bench-g{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.bench-g div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bench-g .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.bench-g .l{font-size:12px;color:var(--dim);letter-spacing:.2px}
.bench-f{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;line-height:1.9;color:var(--dim)}
.bench-f b{color:var(--prose);font-weight:600}
.bench-more{margin-top:12px;background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--dim2);cursor:pointer;letter-spacing:.02em}
.bench-more:hover{color:var(--amber)}
.bench-all{display:none;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px 16px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.bench-all.on{display:grid}
.bench-all div{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:1.7;min-width:0}
.bench-all .k{color:var(--dim2);white-space:nowrap}
.bench-all .v{color:var(--prose);font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:860px){.bench-g{grid-template-columns:repeat(3,1fr);gap:10px}.bench-g .n{font-size:15px}}
.btn{
  padding:12px 26px;border-radius:9px;border:none;cursor:pointer;
  background:var(--green);color:#131a0f;font-weight:700;font-size:15px;
  font-family:inherit;letter-spacing:.5px;transition:.18s;white-space:nowrap;
}
.btn:hover{background:#a4cf88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:#2c3234;color:var(--dim2);cursor:not-allowed;transform:none}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600;padding:10px 18px;font-size:13.5px}
.btn-ghost:hover{background:#2c3234;border-color:var(--green-d);transform:none}

/* ---------- status ---------- */
#status{margin-top:18px;display:none}
#status.show{display:block}
.st-line{
  display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--dim);
  padding:5px 0;font-family:var(--mono);
}
.st-line .ic{width:14px;text-align:center}
.st-line.ok{color:var(--green)}
.st-line.err{color:var(--red)}
.st-line.skip{color:var(--dim2)}
.st-line.skip .ic{color:var(--dim2)}
.spin{
  width:11px;height:11px;border:1.5px solid var(--dim2);border-top-color:var(--green);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 查询中弹窗 ---------- */
#ovl{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(10,11,12,.74);backdrop-filter:blur(7px);
}
#ovl.show{display:flex}
.ovl-box{
  width:100%;max-width:430px;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:20px 22px 18px;box-shadow:0 26px 70px rgba(0,0,0,.65);
  animation:ovlin .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes ovlin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.ovl-top{display:flex;align-items:center;gap:13px}
.ovl-ring{
  width:26px;height:26px;flex:none;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--green);
  animation:sp .8s linear infinite;
}
.ovl-top.done .ovl-ring{
  border-color:var(--green);animation:none;
  background:radial-gradient(circle,transparent 0 6px,var(--green) 6px);
}
.ovl-top.fail .ovl-ring{
  border-color:var(--red);animation:none;
  background:radial-gradient(circle,transparent 0 6px,var(--red) 6px);
}
.ovl-tt{font-size:15.5px;font-weight:600;letter-spacing:.3px}
.ovl-ss{font-size:12.5px;color:var(--dim);font-family:var(--mono);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
/* 失败时这句是给人看的错误说明，不能截成一行省略号 */
.ovl-top.fail .ovl-ss{white-space:normal;overflow:visible;text-overflow:clip;max-width:392px;
  font-family:var(--sans);line-height:1.65}
.ovl-bar{height:3px;border-radius:2px;background:#2b3032;margin:15px 0 12px;overflow:hidden}
.ovl-bar i{display:block;height:100%;width:5%;border-radius:2px;
  background:linear-gradient(90deg,var(--green-d),var(--green));transition:width .4s ease}
.ovl-list{display:flex;flex-direction:column;gap:2px;max-height:206px;overflow-y:auto}
.ovl-list .st-line{font-size:12.5px;padding:3px 0;line-height:1.5}
.st-line.st-sub{padding-left:18px;font-size:12.5px;color:var(--dim2)}
.st-line.st-sub .spin{width:9px;height:9px;border-width:1.2px}
#status .st-line.st-sub{padding-left:18px;font-size:12.5px}
.ovl-list .st-line .spin{width:9px;height:9px;border-width:1.2px}
.ovl-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ovl-time{font-size:12px;color:var(--dim2);font-family:var(--mono)}
.ovl-cancel{
  padding:6px 15px;border-radius:7px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:13px;cursor:pointer;font-family:inherit;transition:.16s;
}
.ovl-cancel:hover{border-color:var(--red);color:var(--red)}

/* ---------- verdict tags ---------- */
.tagrow{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 14px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  color:var(--dim);background:rgba(255,255,255,.035);letter-spacing:.3px}
.chip.hi{color:var(--green);border-color:rgba(150,196,122,.4);background:rgba(150,196,122,.09)}
.chip.bad{color:var(--red);border-color:rgba(227,154,154,.4);background:rgba(227,154,154,.09)}
/* 分级条 */
.gstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 11px;padding:11px 14px;margin:0 0 14px;border-radius:10px;
  border:1px solid var(--line);background:linear-gradient(90deg,rgba(150,196,122,.09),rgba(94,168,240,.05) 55%,transparent)}
.gstrip .gno{font-family:var(--mono);font-size:13px;color:var(--green);border:1px solid var(--green-d);border-radius:5px;padding:0 6px;line-height:18px}
.gstrip .gnm{font-size:18px;font-weight:700;letter-spacing:.5px}
.gstrip .gbd{font-size:12px;color:var(--dim2);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
.gstrip .gsc{font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.gstrip .gsc b{color:var(--txt)}
.gstrip .gsc.warn{color:var(--amber)}
.gstrip .gsc.warn b{color:var(--amber)}
.gstrip .gsw{margin-left:auto;font-size:12.5px;color:var(--dim2)}
.gstrip .gsw b{color:var(--dim);font-weight:600}
.scd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--dim2);
  padding:9px 12px;margin-bottom:16px;border:1px dashed rgba(52,58,60,.9);border-radius:8px;background:rgba(255,255,255,.018)}
.scd .lb{letter-spacing:1px;color:var(--dim)}
.scd .bs{color:var(--dim)}
.scd .up{color:var(--green)}
.scd .dn{color:var(--red)}
.scd i{font-style:normal;color:var(--dim2);opacity:.75}
.scd .cap{color:var(--amber);opacity:.9}
.scd .tt{color:var(--txt);font-family:var(--mono);margin-left:auto}

/* ---------- cards ---------- */
#result{margin-top:22px}
.card{
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:20px 22px;margin-bottom:16px;
}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{font-size:15px;font-weight:600;letter-spacing:1px;color:var(--txt);text-transform:uppercase}
.card-h .ln{flex:1;height:1px;background:var(--line)}
.card-h .tag{font-size:12px;color:var(--dim2);font-family:var(--mono);letter-spacing:0}
.card-h .tag.monkey{
  color:var(--amber);border:1px solid rgba(220,185,110,.45);background:rgba(220,185,110,.12);
  padding:2px 9px;border-radius:20px;font-family:var(--sans);letter-spacing:.4px;
}
.card-h .tag.monkey.soft{color:var(--dim);border-color:var(--line);background:transparent}
/* 填线徽标：战神用绿（正面换命是本事），宝宝用红（纯损耗） */
.card-h .tag.fill{
  color:var(--green);border:1px solid rgba(140,200,110,.45);background:rgba(140,200,110,.12);
  padding:2px 9px;border-radius:20px;font-family:var(--sans);letter-spacing:.4px;
}
.card-h .tag.fillbaby{
  color:var(--red);border:1px solid rgba(210,110,100,.45);background:rgba(210,110,100,.12);
  padding:2px 9px;border-radius:20px;font-family:var(--sans);letter-spacing:.4px;
}
/* 抗压大师徽标：金色，枪法权重 ×1.2（并由此把 6.2 及格线抬到 120 分） */
.card-h .tag.stress{
  color:var(--amber);border:1px solid rgba(220,185,110,.5);background:rgba(220,185,110,.14);
  padding:2px 9px;border-radius:20px;font-family:var(--sans);letter-spacing:.4px;
}

/* identity */
.id-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar{
  width:54px;height:54px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--green-d),#26401f);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:700;color:#dcefd0;border:1px solid #40593a;
}
.id-main h3{font-size:19px;font-weight:600;letter-spacing:.4px}
.id-main .sub{font-size:13px;color:var(--dim);font-family:var(--mono);margin-top:3px}
.id-src{margin-left:auto;text-align:right;font-size:12.5px;color:var(--dim2);line-height:1.8}
.id-src b{color:var(--dim);font-weight:500}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px}
.metric{
  border:1px solid var(--line);border-radius:10px;padding:14px 15px;background:var(--panel2);
}
.metric .k{font-size:12.5px;color:var(--dim);letter-spacing:.3px}
.metric .v{font-size:23px;font-weight:700;font-family:var(--mono);margin-top:5px;letter-spacing:-.5px}
.metric .u{font-size:12px;color:var(--dim2);margin-left:3px;font-family:inherit;font-weight:400}
.srcm{font-size:11px;padding:0 4px;margin-left:4px;border-radius:3px;border:1px solid var(--blue);color:var(--blue);font-family:var(--mono);vertical-align:1px;white-space:nowrap}
.metric.hi .v{color:var(--green)}
.metric.warn .v{color:var(--amber)}
.metric.bad .v{color:var(--red)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:right;font-weight:500;color:var(--dim);font-size:12.5px;
  padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;text-align:right;border-bottom:1px solid rgba(52,58,60,.5);font-family:var(--mono);font-size:13px}
td:first-child{font-family:inherit}
tr:last-child td{border-bottom:none}
td.win{color:var(--green)}
td.lose{color:var(--red)}
tbody tr:hover{background:rgba(150,196,122,.04)}
.bar-cell{width:110px}
.bar{height:5px;border-radius:3px;background:#2b3032;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-d),var(--green));border-radius:3px}

/* segments */
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.seg{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel2);text-align:center}
.seg .t{font-size:12.5px;color:var(--dim2);font-family:var(--mono);margin-bottom:10px}
.seg .chart{height:66px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}
.seg .col{width:26px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--green),var(--green-d));min-height:3px;transition:.4s}
.seg .col.low{background:linear-gradient(180deg,var(--red),#7d484c)}
.seg .col.mid{background:linear-gradient(180deg,var(--amber),#8d7743)}
.seg .pct{font-size:18px;font-weight:700;font-family:var(--mono)}
.seg .m{font-size:12px;color:var(--dim);margin-top:3px;font-family:var(--mono)}

/* flee */
.flee-item{
  display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;
  background:rgba(227,154,154,.07);border:1px solid rgba(227,154,154,.22);
  margin-bottom:7px;font-size:13px;
}
.flee-item .badge{
  font-size:11.5px;padding:2px 7px;border-radius:4px;background:rgba(227,154,154,.18);
  color:var(--red);font-weight:600;letter-spacing:.5px;flex:none;
}
.flee-item .badge.q{background:rgba(220,185,110,.16);color:var(--amber)}
.flee-item .tm{font-family:var(--mono);color:var(--dim)}
.flee-item .cn{color:var(--dim)}
.flee-item .sp{flex:1}
.flee-item .chain{font-size:12.5px;color:var(--red);opacity:.85}

/* squads */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
.sq-box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel2)}
.sq-box .n{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.sq-box .l{font-size:12.5px;color:var(--dim);margin-top:4px}
.sq-box.gold{border-color:#4f4427;background:linear-gradient(180deg,rgba(220,185,110,.09),var(--panel2))}
.sq-box.gold .n{color:var(--amber)}
.sq-box.hi .n{color:var(--green)}
.sq-box.sup{border-color:#6d5729;background:linear-gradient(180deg,rgba(220,185,110,.15),var(--panel2))}
.sq-box.sup .n{color:var(--amber)}
.sqd-i .tag.sup{border-color:#7c6729;color:var(--amber);background:rgba(220,185,110,.12)}
.sq-box.bad{border-color:#5a3a3a;background:linear-gradient(180deg,rgba(227,154,154,.10),var(--panel2))}
.sq-box .n.err{font-size:15px;font-family:inherit;letter-spacing:0;color:var(--red)}
.sq-box .l.warn{color:var(--red);opacity:.85}
.sq-box.clk{position:relative;cursor:pointer;transition:.16s}
.sq-box.clk:hover{border-color:var(--green-d);background:linear-gradient(180deg,rgba(150,196,122,.11),var(--panel2))}
.sq-note{margin-top:12px;font-size:13px;line-height:1.75;color:var(--dim);border-left:2px solid #5a3a3a;padding-left:10px}
.sq-note b{color:var(--red)}
.sq-note.ok{border-left-color:var(--green-d)}
.sq-note.ok b{color:var(--green)}
.env-note{margin-top:13px;font-size:12.5px;line-height:1.75;color:var(--dim2);border-left:2px solid var(--line);padding-left:10px}
.env-note b{color:var(--txt)}
/* 阵营场次饼图 */
.ov-split{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ov-split .tbl-wrap{flex:1 1 430px;min-width:330px}
.ov-split .tbl-wrap table{margin-top:0}
.ov-split .tbl-wrap td:first-child{white-space:nowrap}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:none}
.donut svg{display:block}
.donut .ring{stroke:var(--line);fill:none}
.donut text.t1{fill:var(--txt);font-family:var(--mono);font-weight:700}
.donut text.t2{fill:var(--dim2);font-family:var(--mono);letter-spacing:.5px}
.donut .lg{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.4}
.donut .lg .r{display:flex;align-items:center;gap:7px;color:var(--dim);white-space:nowrap}
.donut .lg .dot{width:9px;height:9px;border-radius:2px;flex:none}
.donut .lg b{color:var(--txt);font-family:var(--mono);font-weight:600}
.donut .lg .p{color:var(--dim2);font-family:var(--mono);font-size:12px}

/* 氪金队明细弹窗 */
#sqDlg{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,11,12,.74);backdrop-filter:blur(3px)}
#sqDlg.on{display:flex}
.sqd{width:100%;max-width:660px;max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:sqdIn .18s ease-out}
@keyframes sqdIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.sqd-h{display:flex;align-items:baseline;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.sqd-h h3{font-size:15px;letter-spacing:.3px}
.sqd-h .sub{font-size:12.5px;color:var(--dim2);font-family:var(--mono)}
.sqd-x{margin-left:auto;width:26px;height:26px;flex:none;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.sqd-x:hover{border-color:var(--red);color:var(--red)}
.sqd-b{overflow:auto;padding:6px 18px 18px}
.sqd-g{margin-top:12px}
.sqd-gh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--amber);font-family:var(--mono);letter-spacing:.5px;padding:6px 0;border-bottom:1px solid rgba(52,58,60,.9)}
.sqd-i{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(52,58,60,.65);font-size:14px}
.sqd-i:last-child{border-bottom:none}
.sqd-i .idx{width:20px;flex:none;color:var(--dim2);font-family:var(--mono);font-size:12px}
.sqd-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sqd-i .arm{font-size:12px;color:var(--dim2);flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sqd-i .tag{flex:none;font-size:12.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--green-d);color:var(--green);background:rgba(150,196,122,.08)}
.sqd-f{font-size:12.5px;color:var(--dim2);line-height:1.7;padding-top:12px;border-top:1px solid var(--line);margin-top:14px}
@media(max-width:560px){.sqd-i .arm{display:none}.sqd{max-height:86vh}}

/* ---------- TOKEN 自动提取弹窗（复用 .sqd 外壳，只有正文是新样式） ---------- */
#tkDlg{position:fixed;inset:0;z-index:215;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,11,12,.74);backdrop-filter:blur(3px)}
#tkDlg.on{display:flex}
.tkd-b{font-size:14px;line-height:1.8;color:var(--prose)}
.tkd-b p{margin:0}
.tkd-b ol{margin:12px 0 0;padding-left:0;list-style:none}
.tkd-b li{margin:11px 0;padding-left:2px}
.tkd-b b{color:var(--txt);font-weight:600}
.tkd-b code{font-family:var(--mono);font-size:12.5px;background:var(--input);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--amber)}
.tkd-bm{display:inline-block;margin:0 2px;padding:7px 15px;border-radius:9px;border:1px dashed var(--amber);background:rgba(220,185,110,.12);color:var(--amber);font-size:14px;font-weight:600;text-decoration:none;cursor:grab;user-select:none;white-space:nowrap;vertical-align:middle}
.tkd-bm:hover{background:rgba(220,185,110,.2)}
.tkd-old{display:block;margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--amber)}
.tkd-old b{color:var(--amber)}
.tkd-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.tkd-st{margin-top:13px;font-size:13.5px;line-height:1.75;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--dim)}
.tkd-st.ok{color:var(--green);border-color:var(--green-d)}
.tkd-st.bad{color:var(--red);border-color:rgba(227,154,154,.42)}
.tkd-fine{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.75;color:var(--dim2)}
/* 窄屏：字号别跟着缩，但表格密度放宽一点，避免列挤成一团 */
@media(max-width:860px){
  table{font-size:12.5px}
  th,td{padding:7px 6px}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
}

/* verdict */
#verdictCard .block{
  padding:18px 0;border-bottom:1px dashed var(--line);
}
#verdictCard .block:last-child{border-bottom:none;padding-bottom:4px}
#verdictCard .lead{
  font-size:18px;font-weight:600;line-height:1.75;letter-spacing:.2px;
}
#verdictCard .lead em{font-style:normal;color:var(--green)}
#verdictCard .lead em.bad{color:var(--red)}
#verdictCard p{font-size:15px;line-height:1.85;color:var(--prose);margin-bottom:9px}
#verdictCard p:last-child{margin-bottom:0}
#verdictCard p b{color:var(--txt);font-weight:600}
#verdictCard p .hl{color:var(--green);font-weight:600}
#verdictCard p .hlr{color:var(--red);font-weight:600}
#verdictCard p .hla{color:var(--amber);font-weight:600}
.final{
  border-left:3px solid var(--green);padding:12px 0 12px 16px;margin-top:6px;
  font-size:16px;line-height:1.9;color:var(--txt);font-weight:500;
}
.motto{font-size:13px;color:var(--dim2);margin-top:14px;font-family:var(--mono)}
/* AI 重写后正文会落进这里（h4 是小标题），样式跟 AI 卡里保持一致 */
#vdBody h4{font-size:13.5px;color:var(--green);letter-spacing:1.4px;margin:20px 0 9px;font-weight:600}
#vdBody h4:first-child{margin-top:0}
/* AI 正在写时的正文骨架：灰条 + 微光，避免先铺规则文案再被整段替换 */
.vd-skel{padding:2px 0 0}
.vd-skel .sk{
  height:13px;border-radius:4px;margin:12px 0;
  background:linear-gradient(90deg,var(--line) 0%,var(--panel2) 50%,var(--line) 100%);
  background-size:220% 100%;animation:skmove 1.5s linear infinite;
}
.vd-skel .w92{width:92%}.vd-skel .w100{width:100%}.vd-skel .w86{width:86%}
.vd-skel .w95{width:95%}.vd-skel .w58{width:58%}
@keyframes skmove{0%{background-position:220% 0}100%{background-position:-220% 0}}
.vd-skel-note{font-size:12.5px;color:var(--dim2);margin-top:16px;letter-spacing:.6px}
.ai-tag{
  display:inline-block;margin-left:9px;font-size:10.5px;padding:2px 7px;border-radius:20px;
  border:1px solid var(--green-d);background:rgba(150,196,122,.13);color:var(--green);
  font-family:var(--mono);letter-spacing:.6px;vertical-align:2px;font-style:normal;font-weight:400;
}

/* ---------- AI 点评 ---------- */
.ai-card .ai-body p{font-size:15px;line-height:1.88;color:var(--prose);margin-bottom:11px}
.ai-card .ai-body p b{color:var(--txt);font-weight:600}
.ai-card .ai-body h4{font-size:13.5px;color:var(--green);letter-spacing:1px;margin:18px 0 9px;font-weight:600}
.ai-card .ai-body h4:first-child{margin-top:0}
.ai-card .ai-body p:last-child{margin-bottom:0}
.ai-run{
  font-size:12.5px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;transition:.18s;
}
.ai-run:hover{border-color:var(--green-d);color:var(--txt)}
.ai-run:disabled{opacity:.45;cursor:not-allowed}
.ai-state{font-size:12px;color:var(--dim2);font-family:var(--mono);letter-spacing:0}
.ai-err{
  font-size:13.5px;color:var(--red);line-height:1.85;background:rgba(227,154,154,.06);
  border:1px solid rgba(227,154,154,.22);border-radius:8px;padding:12px 14px;
}
.ai-err code{font-family:var(--mono);font-size:12.5px;color:var(--amber)}
/* AI 思考中：三点跳动 + 计时，正文到点才露出来 */
.ai-think{display:flex;align-items:center;gap:10px;padding:8px 0 6px;font-size:14px;color:var(--dim2)}
.ai-think .tdots{display:inline-flex;gap:4px;flex:0 0 auto}
.ai-think .tdots i{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.22;animation:thinkdot 1.25s infinite}
.ai-think .tdots i:nth-child(2){animation-delay:.16s}
.ai-think .tdots i:nth-child(3){animation-delay:.32s}
.ai-think b{color:var(--green);font-weight:600;letter-spacing:.4px}
.ai-think em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim)}
@keyframes thinkdot{0%,65%,100%{opacity:.22;transform:translateY(0)}32%{opacity:1;transform:translateY(-3px)}}
.caret{display:inline-block;width:7px;height:15px;background:var(--green);vertical-align:-2px;margin-left:3px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* empty */
.empty{
  text-align:center;padding:60px 20px;color:var(--dim2);
}
.empty .big{font-size:40px;margin-bottom:14px;opacity:.25}
.empty p{font-size:14px;line-height:1.9}
.empty kbd{
  padding:2px 6px;border:1px solid var(--line);border-radius:4px;
  font-family:var(--mono);font-size:12.5px;color:var(--dim);background:var(--panel2);
}

/* history 样式已随「近期查询记录」一并移除（用户 2026-11-08 要求不显示） */

.foot{text-align:center;font-size:12.5px;color:var(--dim2);margin-top:34px;line-height:1.9;font-family:var(--mono)}

/* ---------- 评价体系弹窗 ---------- */
#rb{position:fixed;inset:0;z-index:120;display:none;background:rgba(8,10,9,.8);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#rb.open{display:flex;align-items:center;justify-content:center;padding:24px}
.rb-box{width:min(960px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 26px 80px rgba(0,0,0,.65);overflow:hidden}
.rb-top{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.rb-tt{font-size:15px;font-weight:600;letter-spacing:.3px}
.rb-sub{font-size:12.5px;color:var(--dim2);font-family:var(--mono);margin-top:2px}
.rb-tabs{display:flex;gap:5px;margin-left:auto;margin-right:4px}
.rb-tab{padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.rb-tab:hover{color:var(--txt)}
.rb-tab.on{background:rgba(150,196,122,.13);border-color:var(--green-d);color:var(--green)}
.rb-x{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;
  font-family:inherit;flex:none}
.rb-x:hover{border-color:var(--red);color:var(--red)}
.rb-body{overflow-y:auto;padding:20px 24px 30px;font-size:13.5px;line-height:1.85;color:var(--txt)}
.rb-body h2{font-size:15px;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line);
  color:var(--green);letter-spacing:.3px;font-weight:600}
.rb-body h2:first-child{margin-top:2px}
.rb-body h3{font-size:14px;margin:18px 0 8px;color:var(--txt);font-weight:600}
.rb-body h3::before{content:"§ ";color:var(--green-d);font-family:var(--mono)}
.rb-body p{margin:8px 0}
.rb-body ul,.rb-body ol{margin:8px 0 8px 20px}
.rb-body li{margin:3px 0}
.rb-body strong{color:var(--green);font-weight:600}
.rb-body code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);
  padding:1px 5px;border-radius:4px;color:var(--amber);border:1px solid var(--line)}
.rb-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:10px 0}
.rb-body pre code{background:none;border:none;padding:0;color:var(--txt);font-size:12.5px;line-height:1.7}
.rb-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.rb-body th,.rb-body td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.rb-body th{background:var(--panel2);color:var(--dim);font-weight:600;white-space:nowrap}
.rb-body td{color:var(--txt)}
.rb-body tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.rb-body hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.rb-body blockquote{border-left:2px solid var(--green-d);margin:10px 0;padding:2px 0 2px 12px;
  color:var(--dim)}
.rb-foot{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-top:1px solid var(--line);background:var(--panel2)}
.rb-note{font-size:12.5px;color:var(--dim2);font-family:var(--mono);line-height:1.5}
.rb-copy{margin-left:auto;padding:6px 13px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:.15s;white-space:nowrap}
.rb-copy:hover{border-color:var(--green-d);color:var(--green)}

/* AI 卡片上的体系标记 */
.ai-rb{font-size:11.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--green-d);
  color:var(--green);font-family:var(--mono);cursor:pointer;background:rgba(150,196,122,.08);
  transition:.15s;white-space:nowrap}
.ai-rb:hover{background:rgba(150,196,122,.2)}

@media(max-width:720px){
  .segs{grid-template-columns:repeat(2,1fr)}
  .id-src{margin-left:0;text-align:left;width:100%}
  .metric .v{font-size:21px}
}
/* ---------- 可读性微调（暗底长阅读） ---------- */
/* 中文为主的行别用等宽字体，只有纯数字的格子才配 --mono */
.st-line,.ovl-ss,.card-h .tag,.ai-state{font-family:var(--sans)}
.st-line,.gstrip .gsc,.seg .m,td,.metric .v,.sq-box .n,.seg .pct{font-variant-numeric:tabular-nums}
/* 长段落压行宽：40 字左右，眼睛换行不用回扫 */
#verdictCard .block,.ai-card .ai-body{max-width:46em}
#verdictCard p,.ai-card .ai-body p{font-size:15.5px;line-height:1.95;letter-spacing:.012em;color:var(--prose)}
#verdictCard p+p,.ai-card .ai-body p+p{margin-top:2px}
.ai-card .ai-body h4{font-size:13.5px;letter-spacing:1.6px}
.card{padding:22px 24px}
.card-h h2{font-size:14.5px;letter-spacing:1.2px}
th{padding:8px 9px}
td{padding:8px 9px}
.sq-note,.uid-tip,.hint{line-height:1.8}
/* 底部一次性提示条（AI 连通性测试结果用，几秒自动消失） */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);max-width:min(760px,92vw);
  padding:11px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--mono);font-size:12.5px;line-height:1.65;box-shadow:0 14px 36px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo"><b>从军<span>·</span>成分分析</b><i>ENLISTED PROFILER</i></div>
    <div class="hd-sp"></div>
    <!-- 评价体系入口暂时隐藏（体系文本仍保留，AI 提示词照旧读 rbDoc）；要恢复把 style 去掉即可 -->
    <button class="hbtn" id="rbOpen" style="display:none" title="评价体系 · 12 级分级标准、数据口径与写作规则"><span id="rbDot">?</span></button>
    <button class="tk-btn" id="aiTestTop" title="不查战绩，只验证地址 / KEY / 模型通不通"><span class="dot" id="aiDot"></span><span>测试 AI 连通性</span></button>
    <button class="tk-btn" id="tkToggle"><span class="dot" id="tkDot"></span><span id="tkLabel">未设置 TOKEN</span></button>
  </div>
  <div id="tkPanel">
    <div class="in">
      <div class="tk-row">
        <button class="btn btn-ghost" id="tkGrab" title="用一个小书签从已登录的战火页面自动取一份新 TOKEN">自动提取</button>
      </div>
      <div class="hint">
        TOKEN 有时效，失效后接口会返回 <code>500100</code>。点「自动提取」按提示装一次书签，以后在已登录的战火页面点一下书签，
        回来按 <code>Ctrl+V</code> 就自动填好、验证并保存。<br>
        页面已内置一份 TOKEN，打开就能用；粘一份新的会覆盖它（只存本机浏览器）。
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="search">
    <h1>查成分</h1>
    <div class="search-row">
      <input type="text" id="q" placeholder="昵称（大小写敏感），直接填玩家名" autocomplete="off">
      <input type="text" class="num" id="qn" placeholder="请输入需要分析的场次" title="取样场次" inputmode="numeric" autocomplete="off">
      <button class="btn" id="go">开始分析</button>
    </div>
    <div class="search-row" style="margin-top:9px">
      <input type="text" id="qu" inputmode="numeric" autocomplete="off">
      <button class="btn btn-ghost" id="goUid">按 UID 查</button>
    </div>
    <div class="uid-tip">
      数据可靠，评价仅供参考 ｜ 评分只用本次取样的 N 场（hisBattles），生涯数据仅展示、不参与评价
    </div>
  </div>

  <!-- 评分标尺：基准玩家的数据写死在 JS 的 BENCH 里，这里只挂容器
       （按用户要求不展示这张卡，数据仍参与算分；要恢复把 display:none 去掉即可） -->
  <div class="bench" id="bench" style="display:none"></div>

  <div id="status"></div>
  <div id="result"></div>

  <div class="foot">
    数据源 cjapi.zhanhuo.com
  </div>
</div>

<div id="ovl">
  <div class="ovl-box">
    <div class="ovl-top" id="ovlTop">
      <div class="ovl-ring"></div>
      <div>
        <div class="ovl-tt" id="ovlTitle">正在查询</div>
        <div class="ovl-ss" id="ovlSub">连接 cjapi.zhanhuo.com</div>

<<AI-CORE>>
## 第一部分：我理解的这套体系

### 1. 数据口径（最容易搞错的三个点）

| 字段 | 真实含义 | 常见误读 |
|---|---|---|
| `tankKills` / `aircraftKills` / `apcKills` | **击毁的敌方载具数**（坦克 / 飞机 / 运兵车） | 误读成"坐在载具上杀的人"→ 会反向判成"靠装备吃饭" |
| `grenadeKills` | 手雷与炸药包合计击杀 | 一律判成"只会扔雷清点"，忽略其中炸坦克的部分 |
| `pointsCaptured` | 实际占下旗子的次数 | 当成争夺参与度 → 会冤枉"在点里清人但没站上去"的人 |

**载具折算权重**（战功口径）：坦克 5 人头、飞机 3、运兵车 3。
炸车时乘员死亡本身已计入 `kills`，所以存在约 3 个人头/台的重叠，这是刻意的"战功口径"，不扣。
> 战功值 `wKills = kills + 5×坦克 + 3×飞机 + 3×运兵车`

**已核对（2026-11-08）：接口没有"坐在坦克/飞机里杀了几个人"这种数据。**
- `battleDetail`（单场战绩详情）与 `hisBattles` 字段完全一致：24 个战斗字段 + 昵称/头像/军衔图，
  没有任何武器或载具明细；另试了 13 个可能的细分路径，全部 404。
- `overview.bestScore` 里有一个 `vehicleKills`（各国最高分局的载具总击毁，含卡车、防空炮等
  没有单列的类型）。抽样 10 场全部满足 `坦克+飞机+运兵车 ≤ vehicleKills`，说明这三项是它的子集。
- 669 条记录里 `坦克击毁 ÷ 总击杀` 中位数 1.5%、最高 8.7%，无一条超过 15%。
  若这个字段是"在坦克里杀的人"，专职车长会到 40% 以上，实测不存在。
- 结论：**只判反甲能力，不判"坐车吃饭"**。想侧面看载具依赖，只能用间接信号
  （点内击杀占比低 + 近战/手枪/手雷≈0 + 场均载具击毁高），而且必须说清是推断。

**只用取样口径（硬规则）**：评分、判级、结论全部来自这次取的 N 场（hisBattles 逐场聚合）。
overview 的生涯胜率 / K/D / 场均击杀 / 最高分 / MVP 次数**一律不参与评价**，
不许拿来对比、补强结论，也不许说「生涯其实更高」。生涯数字只在「生涯概览」卡片里展示，
评价里最多提一句累计场次当资历。

**身份是从哪来的**（写评价时可以据此判断证据强弱）：
1. 直接给 UID —— 最硬；
2. 该昵称自己的录像 → 阵容里反查 UID —— 硬，名字就是这个 UID 在用的；
3. 昵称在录像里查不到（隐身号 / 改名 / 回放过期）→ 翻官方 33 个排行榜找这个昵称 —— 弱，
   榜上同名不等于同一个人，遇到「弱证据」标记时评价里不要说得太绝对。
   （程序不再先扫「全服最近 10 场回放」兜底：窗口太小、要多发十来个请求，已按用户要求删掉。）
4. 两条路都落空 → 报「无法搜索该用户」，让用户把昵称反馈给作者，不许瞎猜一个 UID 顶上。

**四国偏向**：按 `country` 聚合（`ger` 德国 / `ussr` 苏联 / `usa` 美国 / `jap` 日本），
算每国的场次、占比、胜率、K/D、场均杀、点内占比；overview 的分国生涯数据只作背景对照，
不参与判定（判定只看这 N 场）。
判定看两件事：**玩得最多的是哪国（意愿）**、**胜率最高的是哪国（实绩）**。
两者不重合就是「爱玩的不是最顺手的」，即情怀压过效率。偏向类型分四档：
单国死忠（只打一国）/ 单国专精（主国 ≥70%）/ 主副搭配（50~70%）/ 多国轮换（35~50%）/ 四国通吃（<35%）。

**对局环境（真人规模 / 组队）**：真人名单来自 `battleDetail?uid=&sessionId=`，每场返回的是**这一场有战绩记录的真人**
（每场 3~13 条，按得分降序）。程序按查询的 N 场逐场取，所以样本场次＝你查的场次。
- **人机不在这份名单里**：人机没有 userid、没有战绩行，接口不会返回它。
  人机只在回放阵容里可见（`userid` 为空的席位），而回放库每人最多留 10 场，且回放 id 与战绩 sessionId 无法互转。
- 因此：**真人规模（我方/对面/全场真人）与固定队友按 N 场统计；人机占比只有回放那 10 场的子样本**，
  没有回放样本时这一项直接空着，不许拿"真人少"当成"人机占比"报出来。
- **组队 = 同一个真人反复出现在他这边、且同队场次达到门槛**。门槛随样本量缩放：**≈ 样本场次 ÷ 30**
  （300 场 → 10 场、150 场 → 5 场、100 场 → 3 场、20 场 → 2 场，最低 2 场）。
  样本越大，同队两三场越可能只是巧合同场，门槛必须跟着抬高，否则人人都是"固定队友"。

**人机局（双方真人合计 < 7）的处理有两条，并行、不要混：**

- **场均击杀 = 人机局整场剔除**（2026-11-08 起）：只拿满编局（≥7 人）的击杀总数 ÷ 满编场次。
  一场满编都没有时回落到加权均值，避免新号出现 0 杀。拿不到阵容的场次仍按满编保留（不猜）。
- **其余指标照旧逐场降权**：4~6 人 = 0.4 场、≤3 人 = 0.2 场、≥7 人 = 1 场；
  胜率 / K/D / 场均被打掉 / 场均得分 / 点内% / 工程·场 / 载具·场 都按这个加权口径算，
  「折合有效场次」= Σ权重。

**死亡口径（2026-11-08 更正，全站统一）**：所有「死亡」都用 `squadDeaths`（这一局被打掉几个班 = 玩家真正被击杀的次数），
**不是** `deaths`（兵员阵亡总数，含班里的每一个兵）。标准1 的实测：100 场被打掉 **486** 个班（场均 4.86），
同期兵员阵亡 3217 人（场均 32.17），两者差 6.6 倍。K/D、场均被打掉、每分钟被打掉、填线判定、被带判定、
逐场表的「被打掉」列，全部按 `squadDeaths` 算；`deaths` 只在标尺卡里作「兵员阵亡/场」参照，不进任何计算。
K/D 的基准也随之变成 **24.84**（标准1：12074 杀 ÷ 486 个班），跟游戏内显示的 K/D 不是一个口径，不要混着引用。

正文里必须说明「场均击杀已剔除 X 场人机局」。**两套口径不要混着推**：
`场均击杀 × 场次 ≠ 总击杀` 是正常的，别拿这个说"数据对不上"。

### 2. 胜负与逃跑的判定

```
胜   : victories >= 1
逃跑 : battleTime = 0 且 battleScore = 0     （全 0 记录）
早退 : 非全 0，但 battleTime < 60 且 battleScore = 0
有效场: 剔除"全 0"后的所有场次（早退仍计入有效场，单独统计比例）
```

**两条胜率必须分开报**：名义胜率（含逃跑，用原始场次算）与实战胜率（剔除全 0 后算）。
逃跑比例 = (全 0 + 早退) / 原始场次。这个比例**不进基础分，只进修正分**，并且在正文里必须单列一段。

### 3. 评分：基础分（100）+ 修正分（+6 ~ −12）

**基础分 五项加权，满分 100，各自封顶归一化：**

| 项 | 公式 | 满权 |
|---|---|---|
| 胜率 | min(胜率 / 95, 1) × 34 | 34 |
| 场均战功 | min(场均战功 / 150, 1) × 24 | 24 |
| K/D | min(K/D / 26.5, 1) × 18（基准 24.84，班数口径） | 18 |
| 场均占点 | min(场均占点 / 2.5, 1) × 12 | 12 |
| 全场第一率 | min(全场第一率 / 60, 1) × 12 | 12 |

**修正分 六项，全部来自战绩接口的其余字段：**

| 项 | 判据 | 加减 |
|---|---|---|
| 点内击杀 | 占比 ≥35% / ≥25% / ≥15% / 不足 15% | +4 / +2 / 0 / −5 |
| 生存 | 每战斗分钟被打掉 ≤0.30 / ≤0.36 / ≤0.42 班（＝标准1 的 0.78 / 0.93 / 1.09 倍）/ 更高 | +3 / +1.5 / 0 / −3 |
| 纪律 | 逃跑+早退比例 ≤0.5% / ≤2% / ≤5% / 更高 | +3 / +1 / −1 / −4 |
| 开团 | 场均一血 ≥0.25 / ≥0.10 / 更低 | +1.5 / +0.5 / −0.5 |
| 支援 | 场均工程 ≥6 次或助攻率 ≥10% / ≥3 次或 ≥7% / 否则 | +1.5 / +0.5 / 0 |
| 反甲 | 载具占战功 ≥20% / ≥10% / ≥4% / 更低 | +3 / +2 / +1 / 0 |

**合成规则：**

```
修正合计先裁剪到 [−12, +6]      （强号不许顶满 100，逃跑多的真该扣）
总分 = clamp(基础分 + 裁剪后修正, 0, 100)
```

**档位：**

| 总分 | 档位 |
|---|---|
| ≥ 91 | 活爹级 |
| ≥ 79 | 大佬级 |
| ≥ 64 | 硬手 |
| ≥ 49 | 能打 |
| ≥ 34 | 路人 |
| < 34 | 混子 |

### 4. 打法标签（不进分数，只做风格指纹）

| 维度 | 阈值 → 标签 |
|---|---|
| 点内参与 | ≥38% 点内绞肉机 / ≥28% 以点为主 / ≥18% 点内外兼顾 / 场均杀 ≥60 点外收割 / 否则 点内参与少 |
| 攻守倾向（点内击杀 >150 才判） | 防守 > 进攻×1.5 守点型 / 进攻 > 防守×2 攻点型 / 否则 攻守均衡 |
| 反甲 | 载具占战功 ≥20% 反甲主力 / ≥10% 会打装甲 / ≥4% 顺手炸车 / 否则 纯步兵位 |
| 近战 | 近战占比 ≥1.2% 贴脸狂 |
| 手雷 | 手雷占比 ≥2.4%：场均载具 ≥0.3 时"炸药包反甲"，否则"手雷党" |
| 手枪 | 手枪占比 ≥0.8% 手枪侠 |
| 一血 | 场均 ≥0.22 开团先锋 / ≤0.06 不打第一枪 |
| 工程 | 场均工事 ≥4 修碉堡的 / 场均工程 ≥6 工兵 |
| 生存 | 被打掉/分 ≥1.09 倍标准1（≈0.42）拿命换头 / ≤0.80 倍（≈0.31）惜命（判「填线战神」时撤掉"拿命换头"，判「填线宝宝」时撤掉"惜命"） |
| 产出 | 得分/分 ≥450 高产出 / ≤300 磨洋工 |
| 小队 | 场均被打光 ≥7 小队常被打光 / ≤4 那一路挺稳 |
| 助攻 | 助攻率 ≥12% 爱补刀 / ≥8% 会配合 |
| 枪法 | 爆头率 ≥13% 枪法硬 / <8% 乱扫 |
| 处境（称号） | 少打多加成成立 → 以少打多；出彩 ≥8 场且占比 ≥45%、对面平均多 ≥1 人 → **抗压大师**（枪法权重 ×1.2） |

### 4.5 玩家分级（12 级 / 6 大档 × 2 小档）

**判定口径**：**总分 = 枪法分 + 六项额外加分 + 环境修正（填线 ±、少打多 +）**，不是六维加权；
**6.2 的及格线 = 标准1 本人加完抗压权重后的 120 分**（100 分只是标准1 的原始枪法刻度，只够 6.1）。
「抗压大师」给的是**枪法权重 ×1.2**（算在枪法分里，不另立加分项）。
**标尺是一条写死的基准战绩**：代号 `标准1`（UID 2341138，2026-11-08 取样 100 场，生涯 428 场）。
- **枪法分 = 枪法比 × 100**。**枪法比 = 场均击杀（人机局整场剔除、只算满编局）÷ 标准1 的 120.7**
  （只看击杀数，K/D 不进枪法分）。枪法比还会被两项放大：**击杀领先 +0~18%**、**抗压大师 ×1.2**。
  标准1枪法比 = 1.0 → **枪法分 100**；他本人是抗压大师（枪法比 ×1.2）→ **总分 120 分**，
  **这 120 分就是 6.2 的及格线**（拿满 100 分只到 6.1）。
- **额外加分**（比例 4 : 2 : 1 : 1 : 1 : 1，只算**超出标准1的部分**，标准1本人恒 0）：
  修造复活点（工程设施/场，标准1 4.61）4 份、反击载具（**击毁台数/场，一台算一台，不折算战功**，标准1 1.52）2 份、
  占领点（占旗/场，标准1 1.81）1 份、点内击杀占比（标准1 25.7%）1 份、K/D（标准1 24.84）1 份、场均击杀（标准1 120.7）1 份。
  每份 **0.6 分**，加分封顶 **+6**。
- **击杀领先加成**（2026-11-08 新增，只放大枪法分，不动加分项）：
  逐场取该局有战绩记录的真人名单，按**击杀数降序**排，取紧随其后的那一位，算
  `领先度 =（本人击杀 − 下一位击杀）÷ 本人击杀`（0~1；本人不足 5 杀、或没有下一位的场次不计），
  再按场次权重（人机局降权）求平均，**加成 = 18% × 平均领先度，封顶 18%**，直接乘在枪法比上。
  对照：100 杀 vs 下一位 50 杀 → 领先 50% → 枪法权重 **+9%**（80 分 → 87.2 分）；
  100 vs 25 → +13.5%；100 vs 0 → +18%（封顶）。含义是"把同场第二名甩开"比"跟一群人挤着刷人头"更值钱。
  名单来自 `battleDetail`，只含**有战绩记录的真人**（每场 3~13 条），人机不在内，所以是"真人对真人"的领先度。
- **被带判定（🐵）**（2026-11-08 新增，贴标签，**不改分数、不改分级**）：
  逐场取同队（同 country）名单里**击杀最高的那个队友**，四条同时成立才算这一场「被带」：
  ① 队友击杀 ≥ 本人击杀 × 1.8（他确实是队里的主攻手）；
  ② 队友被打掉 ≥ max(0.45, 本人 × 2)（他在正面换命，不是缩着打）；
  ③ 本人被打掉 ≤ 队友击杀 × 0.06（自己这条命保得太干净）；
  ④ 本人 K/D ≥ 19.9（不是打不动，是打得「太漂亮」）。
  外加本人该场至少 5 杀，免得 3 杀 0 死的偶发局把人判死。
  占比 = 命中场数 ÷ **能取到同队名单的场数**（`battleDetail` 名单残缺，只能这么算，界面必须写样本量）。
  **占比 ≥ 40% 且命中 ≥ 3 场** → 贴「🐵 被带」标签（有倾向）；
  **占比 ≥ 60% 且命中 ≥ 5 场** → 判定「**🐵 完了**」，正文直说这个 K/D 是队友挡出来的，往下砍一档看待。
  用户口径的例子：队友 100 杀 / 被打掉 7 个兵（≈2 个班）、本人 50 杀 / 被打掉 2 个兵（≈1 个班）→ 命中，判 🐵。
  （阈值按班数口径换算：队友被打掉 ≥ max(0.45, 自己×2)、自己 ≤ 队友击杀×0.06、自己 K/D ≥ 19.9。）
  这条只影响**文案和标签**：不扣分、不加分、不动分级；正文禁止把「死亡少」夸成会走位、会惜命。
- **填线判定**（2026-11-08 新增，**算进总分**，两种方向）：
  "填线"=往战线上填人，正面顶、拿命换位置。只看 K/D 会把这种人看扁，所以要单独算一笔。
  - **填线战神**（杀得多、死得也多、K/D 被死亡拖低）：三条同时成立
    ① 场均击杀 ≥ 标准1 的 45%（≈54 杀/场）；② 场均被打掉 ≥ 标准1 的 115%（≈5.6 个班/场）；
    ③ K/D ≤ 标准1 的 45%（≈11.2）。→ **总分 +2 ~ +6.5 分**，
    强度 = 0.45×击杀规模 + 0.30×死亡规模 + 0.25×KD 之低，再线性映射到加分区间。
    正文口径：死得多不是不会躲，是他在最前面；这号是按人头硬换、把对面按在正面，队友才推得上去。
    **判了战神，「拿命换头」这个标签要撤掉**（那不是缺点，是他在顶）。
  - **填线宝宝**（杀得少、死得还多）：三条同时成立
    ① 场均击杀 ≤ 标准1 的 35%（≈42 杀/场）；② K/D ≤ 5.96（≈标准1 的 24%，兵数口径的「K/D≤0.9、死多于杀」）；③ 场均被打掉 ≥ 3.6 个班。
    → **总分 −1.2 ~ −4 分**，强度 = 0.55×杀得少的程度 + 0.45×KD 之低。
    正文口径：这不叫敢冲，是冲上去没换成（路线直、不看侧翼、死在还没抬枪的时候），属于纯兵力损耗。
    **判了宝宝，「惜命」标签要撤掉**（死得多才被判的宝宝，惜命是反话）。
  - 样本 < 8 场不判（噪声太大）；这笔**直接进总分、不改枪法比**，所以「枪法 100% = 标准1」这条刻度不受影响。
  - 两个方向的正文都只描述打法与产出，**不许升级成人身攻击**，也不许说人"菜"。
- **少打多加成**（2026-11-08 新增，**算进总分**，只加不减）：
  逐场用 `battleDetail` 名单比人数，**对面名单比我们多 ≥2 个真人**（`opN − myN ≥ 2`）算一场「少打多」。
  这局里还打得出来——**本人击杀 ≥ 我方人均击杀 ×1.25**（人少的一边还比队友能杀），**或本人是整场击杀第一**——记一场「逆势出彩」。
  **命中 ≥ 3 场且命中率 ≥ 35%** 才给分：`强度 = 0.6 × min(1, 平均人数差/3) + 0.4 × min(1, 命中率)`，
  加分 **+1 ~ +5 分**。正文口径：同样一个人头，在少打多的方向上换出来含金量不一样；这种局换谁打数据都会掉一截。
  **口径必须写明**：`myN / opN` 来自战绩名单（每场只回 3~13 条，人机不在名单里），只能当"这一场哪边人多"的相对信号，
  不是真实满编人数。
- **「抗压大师」称号**（2026-11-08 新增，**枪法权重 ×1.2**）：
  少打多局里"打得出来"的场次够多才发，三条同时成立——
  **① 出彩场次 ≥ 8 场**（"场次多"就指这一条绝对量）；**② 出彩占全部少打多局 ≥ 45%**（防止样本极大时几场也算多）；
  **③ 对面平均多 ≥ 1 个真人**（少打多本身每场对面就至少多 2 人，所以这条基本不额外卡人，只用来写正文）。
  - **给的是枪法权重，不是另开一笔**：命中称号后 **枪法比 ×1.2**（即枪法分提高 20%），
    这一笔**在枪法分里**，会随枪法一起进 `core`、**参与 `6.2+ / 数据有疑问` 判定**（枪法才是核心项）。
  - **及格线跟着他走**：标准1 本人就是抗压大师，所以 **6.2 的及格线 = 100 × 1.2 = 120 分**
    （`OVER_SCORE`）。也就是说 6.2 的含义是"人头到标准1 的量、场面也吃得住"，
    单拿 100 分（= 标准1 的原始枪法）只到 6.1。分带**只把 6.2 这一档的上边界抬到 120**，下面 11 档门槛不动。
    例：枪法比 70% + 抗压 ×1.2 → 84% → 84 分（6.1）；要到 6.2 得 100 分 + 抗压（120 分），
    或 120% 枪法（≈145 杀/场）不带抗压。
  - **不许再叠第三笔**：少打多加成（1~5 分）照给，但那本来就是环境补偿；抗压大师这一笔已经在枪法里，
    正文**禁止**再把它写成"另加 X 分"，也禁止另外再加分。
  - 正文写法：人少也肯往上顶、不挑局、不是被局势推着走；**不许**写成"喜欢送"或"人多就崩"。
  - `stress` 强度只用于文案语气（"很靠前的一档" vs "不挑局"），不参与计算。
- **环境修正不参与判级**：填线修正与少打多加成**直接进总分**，但 `6.2+ / 数据有疑问` 只看
  **枪法分 + 额外加分**（`core`）。否则两笔补偿叠加最多 +11.5 分，会把一个正常号硬推过 138 那条"疑似开挂"线。
  （抗压大师放大的是枪法本身，**属于 `core`**，不受这条限制。）
  - **比标准1强 → 6.2+**：枪法 + 加分越过 **120**（= 标准1 加完抗压权重的分）只记「**6.2+ 超出刻度**」，
    这是真人能打出来的上限，**不许写成开挂**。
- **超出 15% → 数据有疑问**：总分越过 **138**（= 120 × 1.15，比标准1高出一成半以上）记「**6.2+ 数据有疑问（疑似开挂）**」。
  这种号正文要写"比标准1还高一成半以上，这个幅度不像真人打出来的"，但不许人身攻击，
  给一句"样本可能有问题（人机局/代打/车队刷）"或"建议自查"就够。
- **逃跑不扣分**：全 0 记录（0 杀 0 死 0 分）与早退只是不进统计，不再额外扣分。
分带：`<10 1.1`、`<23 1.2`、`<32 2.1`、`<39 2.2`、`<46 3.1`、`<53 3.2`、`<61 4.1`、`<69 4.2`、
`<78 5.1`、`<87 5.2`、`<120 6.1`、`120 分 6.2`、`>120 记 6.2+`、`>138（+15%）记 6.2+ 数据有疑问`。
（6.1 这一档的宽度从 87~100 拉到了 87~120，因为 6.2 的及格线抬到了 120；其余 11 档门槛没动。）
不再按生涯场次封顶（生涯数据不参与评价）。

**标定基准**：下面那组「建标画像」只用来写各档的定性描述（这一档该是什么样、该练什么），
不再反推分带；真正的锚点是标准1的枪法数值。要换标尺，改页面里 `BENCH` 的数值即可。
换完记得回填 `BASE_SCORE`（标准1的判分，默认 100），并重跑一遍 `生成三个版本.py`。
胜率 35/43/47/50/53/58/63/68/73/80/86/92（%），K/D 4/6/8/9/11/13/15/17/20/25/29/37（班数口径），
场均击杀 12/28/38/46/55/65/75/88/100/120/135/150，生涯场次 80/400/900/1200/2000/3000/4000/5000/6000/7000/9000/12000。

### 5. 正文结构（规则版 12 段左右，AI 版 8~12 段）

| # | 段落 | 必须回答的问题 |
|---|---|---|
| 0 | 分级 | 几级几档、判定分、这一档的画像，一句话定性 |
| 1 | 结论 | 什么档位、判定分、取了哪些场、几胜几负 |
| 2 | 枪法与反甲 | 场均杀/死/助、爆头率、击毁载具台数与折算战功、载具占比意味着什么 |
| 3 | 打法诊断 | **核心判据是点内击杀占比，不是占点次数**；攻点型还是守点型；占点次数只作辅助并说明二者不同 |
| 4 | 武器构成 | 近战/手雷/手枪比例说明交战距离偏好；高载具时雷要解读成炸药包 |
| 5 | 支援与效率 | 工程、工事、助攻、得分效率、被打掉班数、被打掉频率 |
| 6 | 稳定性 | 四段胜率走势（看极差，不只看首尾） |
| 7 | 逃跑 | 必须单列：几场全 0、几场早退、是否连续逃、名义胜率与实战胜率的落差 |
| 8 | 四国偏向 | 主玩哪国、集中度多少、偏向类型；最能打的是不是主玩国；最弱是哪国、该少碰哪个 |
| 9 | 对局环境 | 按 N 场统计：每场双方几个活人、我方/对面真人各几个、这数据有多少水分；有没有固定车队、同队几场（人机占比只在有回放子样本时提） |
| 10 | 氪金 | 氪金队共几支（其中高级 X 支）、是否重氪、分布在哪国（超级小队不统计、不许提） |
| 11 | 作息 | 最活跃时段、日均场次、凌晨党/早场党/晚场党 |
| 12 | 分级对标 | 这一档的画像、他哪几项撑着/哪几项拖着、这一档的对战换算 |
| 13 | 升级路径 | 距下一档差多少分、差哪一项、具体练什么 |
| 14 | 总结 | 一句定性，不许重复开头原话 |

### 6. 写作纪律（模型必须遵守）

1. **只用给定数字**。数据里没有的（地图、武器型号、具体某场战例）一律不许编。
2. **每个数字都要跟判断**。不许原样罗列，要说这说明他什么、强在哪、弱在哪。
3. **必须指出至少一个真实短板**，并说明这个短板在实战里会造成什么后果。只夸不批不合格。
4. **数据为空就跳过**。逃跑、氪金、作息这三块若没数据，不提，不许编。
5. **语气像贴吧老哥**：直白、有点损、有火气，但不人身攻击，不用脏话，不用 emoji
   （唯一例外：被带判定可以原样写「🐵」，那是用户定的叫法），
   不说"作为一个AI""根据数据分析"，不用书面报告腔。
6. **篇幅 1000~1500 字，分 8~12 段**，段落长短要交错。小标题最多 2 个（如 `## 先说结论`），爱用不用。
7. **结尾单独一段给总评**，不许重复开头原话，短、有态度。
8. 可以用**加粗**强调关键数字，但一段里不超过两处。
9. **禁用套话**：首先、其次、再次、最后、综上所述、总的来说、值得注意的是、不难看出、从数据来看、
   整体表现、综合来看、具有一定的、表现出色、有待提高、作为一名玩家、可以说、换言之。
10. **每段不许同一个模板开头**（比如每段都以「XX 方面」起）。不同档位的评价重心也要不一样：
    1.x 讲习惯，2.x 讲稳定，3.x 讲局面，4.x 讲战术，5.x 讲 carry，6.x 讲压制。
11. **第一句直接下判断**：他是几级几档、强在哪、弱在哪。禁止任何铺垫式开场。
12. **必须写清分级对标**：这一档的画像、他哪几项撑着哪几项拖着、这一档打老兵/路人王要几个，
    以及距下一档差哪一项。泛泛地说「还需努力」不合格。
13. **必须单列四国偏向**：主玩国 + 集中度 + 偏向类型；爱玩的国不是最强的国就要点出来；
    结尾给一句"多玩哪个、少碰哪个"的具体建议。
14. **必须单列对局环境**：按 N 场统计的真人规模（每场双方几个活人、我方/对面各几个）、
    有固定车队要写出队友和同队场次，并点明「这不是纯单排数据」。
    人机占比只有回放子样本里有，有就带一句，没有就不要编。
    **有人机局时，禁止把胜率当纯个人实力吹**，必须提一句"人机局已按权重折算"；
    场均击杀是另一套口径，见下条。
15. **人机降权与分级结论要一致**：折合有效场次明显小于名义场次时，正文必须提到，
    不许一边降权一边照着降权前的数字夸。
    **场均击杀一律标注「已剔除 X 场人机局」**（满编局口径），不许写成"全部场次的场均"。
16. **被带判定与夸奖要打架**：命中「🐵 被带」时，不许再把「死亡少」写成会走位、会惜命、生存意识好，
    必须改口成"没上去 / 队友在前面替他挡"。这一条不改分数，但必须改说法。
17. **填线判定必须点明称号**：资料里出现「填线战神 / 填线宝宝」时，正文要写出对应称号并解释那笔加减分。
    - 战神：不许把「死得多、K/D 低」当缺点写（也不是"送"），要写成"在正面硬换、把对面按在点上"；
      也不许说他"不会活"——他是不躲。加分已算进总分，**不许再额外给分**。
    - 宝宝：不许把"敢冲、敢拼"当夸奖（那是冲上去没换成），要写成纯兵力损耗；
      扣分已算进总分，**不许再额外扣分**，也不许用"菜""废物"这类词。
18. **少打多必须写清前提**：资料里出现「少打多加成」时，正文要写出**几场是少打多／对面多几个真人／其中几场他打得出来**，
    并点明「同样的人头在少打多的方向上换出来，含金量不一样」。加分已算进总分，**不许再额外加分**。
    **不许**把这份加成说成"对面菜""打人机"；也要写明口径是战绩名单（每场 3~13 条、人机不在内），
    不是真实满编人数。
19. **抗压大师给的是枪法权重**：资料里出现「抗压大师」时必须点明这个称号，写成"人少也肯顶、不挑局"，
    并说明评分上**枪法权重 ×1.2**（枪法比从 <X>% 抬到 <X>%，折 +<X> 分，**在枪法分里、不另立加分项**）；
    标准1 本人就是抗压大师，所以 **6.2 的及格线是 120 分**，不是 100 分，**别把 100 分说成满分或及格线**。
    **禁止**再给它叠第三笔分，也**禁止**把它说成"专门去送"或"人一多就崩"。

### 7. 六个必须避开的判断陷阱

1. **别用占点次数判"数据刷子"** —— 应该看点内击杀占比。在点里清人、让队友站上去，旗子不算他的，但活是他干的。
2. **走势别只看首尾差** —— 首尾接近但中间挖了 20 多个点的坑，属于"过山车"，要用四段极差判。
3. **逃跑别混进胜率** —— 全 0 记录会同时拉低胜率、击杀、得分，必须先剔除再算，然后单独评价。
4. **载具别反向解读** —— 这是击毁敌方载具，越高越是反甲战果，不是"靠铁疙瘩吃饭"。
5. **手雷别一口咬定清点** —— 场均载具 ≥0.3 台时，雷里有相当比例是炸坦克的炸药包。
6. **人机局别当硬实力** —— 人机只存在于回放阵容（`userid` 为空的席位），战绩名单里全是真人。
   活人很少（每场双方合计不到 8 个）或人机占比过半时，胜率和场均击杀都要打折看，
   不许拿人机局的 90% 胜率说这人能打。反过来，满编真人局里同样的数据含金量更高，这点要讲出来。

   炸车时乘员死亡本身已计入击杀，存在少量重叠，这是刻意的口径，不许当作问题指出。
3. grenadeKills 是手雷与炸药包合计。若数据里场均载具 ≥0.3 台，说明雷里有相当比例
   是往坦克上扔的炸药包，属于反甲；不许一口咬定「只会扔雷清点」。
4. pointsCaptured 是实际占下旗子的次数。它低不代表不参与争夺——在点里把人清掉、
   让队友站上去，旗子不算他的。判断争夺参与度要用「点内击杀占比」，不是占点数。
5. 「全 0 记录」（时长 0、得分 0）是逃跑，已从有效战绩里剔除。逃跑比例单独给出，
   必须单独成段评价，不许混进胜率里糊过去。名义胜率与剔除后的实战胜率要分开说。
6. **超级小队这一档不统计**（页面里显示 NaN）。接口 type 字段两个方向都会错标、按名字认也不
   值得再费口舌，所以这块整体作废：评价里**不许出现「超级小队」相关的任何说法**，
   既不报支数、也不点名字，连「顶级氪金」这类暗示都别写。只说高级队 / 非氪金的规模。
7. 胜率 / K/D / 场均击杀 / 单场最高 / 全场第一 这五项，只能用「最近 N 场」的取样值。
   生涯（overview）的对应数字不参与评价，数据串里也不给，不许自己编，也不许说「生涯更高」。
8. 四国偏向按 country 聚合（德/苏/美/日），给出每国场次、占比、胜率、K/D、场均杀。
   主玩国（场次最多）和最强国（胜率最高）不一定是同一个；不重合时必须点出来，别混成一句话。
   偏向类型：单国死忠 / 单国专精（主国 ≥70%）/ 主副搭配（50~70%）/ 多国轮换（35~50%）/ 四国通吃。
9. 对局环境里，**人机 = 回放阵容中 UID 为 0 的席位**，不是打得菜的人；
   真人规模按这次取的 N 场逐场统计（battleDetail 名单里全是真人，不含人机），写的时候带样本场次。
   组队 = 同一个真人反复出现在他这边、且同队场次达到门槛：门槛 ≈ 样本场次 ÷ 30
   （300 场要 ≥10 场、150 场 ≥5 场、100 场 ≥3 场、20 场 ≥2 场），够不上门槛的不算固定队友。
   人机占比只在有回放子样本时才有；人机占比高时，胜率与场均击杀要打折看，不许当纯个人实力吹。

【写作要求】
1. 只使用给定数据里的数字和事实。绝对不许自己编数字、编战例、编地图或武器型号。
   数据里没有的，就不提。
2. 不要原样罗列数据。每个数字都要跟一句判断：这说明他什么、强在哪、弱在哪、可不可信。
3. 评价要有层次：先给分级结论，再讲枪法与反甲，再讲打法（点内还是点外、攻还是守），
   然后武器构成、支援效率、稳定性与走势、逃跑、四国偏向、对局环境（人机/组队）、氪金、作息，
   然后分级对标、升级路径，最后一句总评。
4. 必须指出至少一个真实短板，并说明这个短板在实战里会造成什么后果。
   只夸不批的评价不合格。
5. 逃跑、氪金、作息这三块如果数据里为空，就跳过，不要编。
6. 语气：贴吧老哥。直白、有点损、有火气，但不人身攻击，不用脏话，不用 emoji，
   不说「作为一个AI」「根据数据分析」这类话，不用书面报告的腔调。
7. 篇幅 1000~1500 字，分 8~12 段，段落长短交错；小标题最多 2 个，爱用不用。
8. 第一句直接下判断（几级几档、强在哪、弱在哪），禁止铺垫式开场。
9. 结尾单独一段给一句总评，短、有态度，不许重复开头的话。
10. 允许使用加粗强调关键数字，但一段里不要超过两处。
11. 禁用这些词：首先、其次、再次、最后、综上所述、总的来说、值得注意的是、不难看出、从数据来看、
    整体表现、综合来看、具有一定的、表现出色、有待提高、作为一名玩家、可以说、换言之。
12. 每段不许用同一个模板开头；不同档位的重心必须不同：1.x 讲习惯，2.x 讲稳定，3.x 讲局面，
    4.x 讲战术，5.x 讲 carry，6.x 讲压制。
13. 必须照抄分级数据里的「画像 / 对战换算 / 升级建议」这三项结论，不许自己改数字或另编一套说法。
14. 必须单列四国偏向：主玩国、集中度、偏向类型；最能打的国不是主玩国就要说出来；
    最后给一句「多玩哪个、少碰哪个」的具体建议。
15. 必须单列对局环境：回放样本场次（说明是抽样）、人机占比、对面真人平均几个；
    有固定车队要写队友和同队场次，并点明「这不是纯单排数据」。
16. 若数据里给了「人机局」，正文必须提到折合场次与**场均击杀已剔除的场数**，不许装作满编局，
    也不许把「场均击杀 × 场次」当成总击杀来质疑数据。

## 第三部分：换成别的模型怎么改

网页版的评价逻辑内置在 `成分分析.html` 里，**换模型不用改任何代码**，改页面顶部那块配置就行：

```js
const AI_CFG = {
  url:   "https://api.deepseek.com/v1",   // 换成别家的 OpenAI 兼容地址
  key:   (function(a){ ... })([63, 59]),  // 混淆体，不是明文，不要手改
  model: "deepseek-chat"                  // 模型名，必须和那家模型列表一致
};
```

`url` 和 `model` 可以直接改，保存后按 `Ctrl+F5` 刷新，点右上「测试 AI 连通性」确认通即可。

**`key` 那一行不能手改。** 它存的是「逐个字符码异或 0x5A 后倒序」的数组，
只有在网页运行时才还原成真 KEY，临时存在于内存，不落盘、不显示。
所以文件里搜不到 `sk-` 开头的完整串，转发或截图也不至于把额度送人。

换 KEY 就双击同目录的 `设置DS配置.bat`，按提示粘贴新 KEY（输入不显示，也不写进 bat），
它会重新算好混淆体写回网页，并留一份 `.bak`。

前提是那家提供 **OpenAI 兼容接口**（`/v1/chat/completions` + SSE 流式），
DeepSeek、通义、智谱、Kimi 都兼容；不兼容的只能手工用：把【第二部分】提示词
和【第三部分】数据模板贴进网页版对话框，一样能用，只是没有自动填入。

两个可能踩的小坑：
- 前端写死了 `temperature: 0.9`、`max_tokens: 4000`。个别模型不接受这个上限或要求范围更小，
  会报参数错误；页面已做兜底，遇到参数类 400/422 会自动去掉这两个字段重发一次。
- 有些厂商不允许浏览器跨域直连。页面是本地 `file://` 打开的，只有明确放行 `null` 源的接口能直连
  （DeepSeek 官方接口放行，实测可用）。

### 如果你想让模型自己从原始记录里找规律

不建议在正式流程里这么做，原因有三个：
- 100 场 × 28 字段约 3~5 万 token，成本和延迟跳一档；
- 同一份数据两次评价可能给出不同结论，显得不可靠；
- 模型算平均、算比例、算比值经常出错，尤其百分比与小数。

要试可以，但必须把算好的聚合值一起给它，并且明确要求"以给定聚合值为准，你只做解读"。
